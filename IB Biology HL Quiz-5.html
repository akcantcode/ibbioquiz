M("D2.3","What happens to a plant cell in a hypotonic solution?","It becomes turgid, and the cell wall prevents bursting",["It undergoes plasmolysis","It bursts","It shrinks"],"Turgor pressure supports non-woody plant tissue.");
F("D2.3","In a hypertonic solution, a plant cell’s membrane pulls away from its wall. This is called _____.",["plasmolysis"],"The cell loses turgor.");
M("D2.3","Why are isotonic solutions used in medicine?","They prevent cells from gaining or losing water, for example in IV fluids and bathing organs for transplant",["They kill bacteria","They increase blood volume permanently","They provide energy"],"Isotonic solutions have the same solute concentration as body fluids.");
M("D2.3","Potato cylinders are placed in a range of sucrose solutions. How is the isotonic concentration found?","It is the concentration at which the percentage change in mass is zero",["Where mass gain is greatest","Where mass loss is greatest","Where the cylinders float"],"Read from where the graph crosses the x-axis.");
M("D2.3","What is water potential? (HL)","The potential energy of water per unit volume; water moves from higher to lower water potential",["The pressure of solutes","The volume of water in a cell","The salt concentration only"],"Values are given relative to pure water at atmospheric pressure.");
M("D2.3","A cell has solute potential –0.6 MPa and pressure potential +0.2 MPa. What is its water potential? (HL)","–0.4 MPa",["–0.8 MPa","+0.4 MPa","–0.12 MPa"],"ψw = ψs + ψp = –0.6 + 0.2 = –0.4 MPa.");
M("D2.3","What is the water potential of pure water at atmospheric pressure? (HL)","Zero",["+100 kPa","–100 kPa","+1 MPa"],"Adding solute lowers water potential, so values for solutions are zero or negative.");
M("D2.3","Where do negative pressure potentials occur in plants? (HL)","In xylem vessels, where sap is under tension during transpiration",["In turgid parenchyma cells","In phloem sieve tubes only","In root hair vacuoles"],"Pressure potential is generally positive inside turgid cells.");

/* ---- Unit D part 2 ---- */
/* D3.1 Reproduction */
M("D3.1","What is an advantage of asexual reproduction?","Rapid production of genetically identical offspring that suit a stable environment",["Increased genetic variation","Offspring always differ from the parent","It requires two parents"],"Sexual reproduction instead produces genetic variation, which helps populations adapt to changing environments.");
M("D3.1","What is an advantage of sexual reproduction?","It produces genetic variation, which helps a population adapt to environmental change",["It is faster than asexual reproduction","It needs only one parent","It produces clones"],"Gametes are produced by meiosis and combine at fertilization.");
M("D3.1","How do sperm and egg cells compare in humans?","Sperm are small, numerous, motile and have few food reserves; eggs are large, few and non-motile with food reserves",["Sperm are larger than eggs","Eggs are numerous and motile","Both are the same size"],"Gametes are specialised for their roles.");
M("D3.1","Which hormone surge triggers ovulation?","Luteinising hormone (LH)",["Progesterone","Oestradiol","Insulin"],"FSH stimulates follicle development, and oestradiol from the follicle triggers the LH surge.");
F("D3.1","After ovulation, the remains of the follicle form the corpus _____, which secretes progesterone.",["luteum"],"Progesterone maintains the endometrium.");
M("D3.1","What is the role of FSH in the ovarian cycle?","It stimulates the development of follicles in the ovary",["It causes ovulation directly","It maintains the corpus luteum","It stops menstruation"],"The follicle secretes oestradiol as it grows.");
M("D3.1","How is IVF used to increase the number of eggs? (HL)","Normal hormone secretion is suppressed, then FSH is given to induce superovulation",["Giving progesterone only","Removing the ovaries","Giving insulin"],"Several eggs are collected, fertilised in vitro and embryos are transferred to the uterus.");
M("D3.1","What is pollination?","The transfer of pollen from an anther to a stigma",["The release of seeds from a fruit","The transfer of nectar","The germination of seeds"],"Pollen may be carried by wind, insects or other animals.");
M("D3.1","Why can self-pollination be disadvantageous?","It leads to inbreeding and reduced genetic diversity",["It increases variation","It prevents seed formation","It requires animals"],"Mechanisms promoting cross-pollination include different timing of anther and stigma maturation, and self-incompatibility.");
M("D3.1","What does GnRH do at puberty? (HL)","It stimulates the pituitary to release FSH and LH, which stimulate sex hormone secretion",["It directly produces testosterone","It causes ovulation only","It inhibits the pituitary"],"The hypothalamus controls the pituitary gland.");
M("D3.1","How do spermatogenesis and oogenesis differ? (HL)","Spermatogenesis gives four sperm per meiosis, whereas oogenesis gives one egg and polar bodies by unequal division",["Oogenesis gives four eggs","Spermatogenesis gives one sperm","They are identical"],"Oogenesis starts before birth, and the oocyte is arrested.");
M("D3.1","How is polyspermy prevented? (HL)","Cortical granules release enzymes that harden the zona pellucida after one sperm enters",["Sperm lose their tails","The egg moves away","Progesterone blocks sperm"],"The cortical reaction follows fusion of the first sperm with the egg membrane.");
M("D3.1","Pregnancy tests detect which hormone? (HL)","hCG, secreted by the embryo after implantation, using monoclonal antibodies",["Insulin","Progesterone only","FSH"],"hCG maintains the corpus luteum in early pregnancy.");
M("D3.1","How is the placenta adapted for exchange? (HL)","Maternal and fetal blood come close for diffusion of gases and nutrients, but they do not mix",["Maternal and fetal blood mix","It has no blood supply","It is a solid barrier"],"The placenta also secretes progesterone and oestradiol.");
M("D3.1","How is childbirth controlled? (HL)","By positive feedback: oxytocin stimulates contractions, which stimulate more oxytocin release",["By negative feedback with insulin","By FSH only","By falling oxytocin"],"Progesterone levels fall before birth.");

/* D3.2 Inheritance */
M("D3.2","Tt × Tt: what is the expected phenotype ratio of offspring?","3 dominant : 1 recessive",["1 : 1","All dominant","1 : 2 : 1"],"The genotype ratio is 1 TT : 2 Tt : 1 tt.");
F("D3.2","An individual with two different alleles of a gene is described as _____.",["heterozygous"],"Homozygous individuals have two identical alleles.");
M("D3.2","Phenylketonuria (PKU) is caused by a recessive allele. Two unaffected carriers have a child. What is the chance it is affected?","25%",["50%","75%","0%"],"Each parent is Pp, giving a 1 in 4 chance of pp.");
M("D3.2","In the ABO system, alleles Iᴬ and Iᴮ are:","Codominant, with i recessive",["Both recessive","Incompletely dominant","Linked alleles"],"Both Iᴬ and Iᴮ are expressed in the heterozygote.");
M("D3.2","What is the genotype of a person with blood group O?","ii",["IᴬIᴮ","Iᴬi","Iᴮi"],"Group O is homozygous recessive.");
M("D3.2","Iᴬi × Iᴮi: which blood groups are possible in the children?","A, B, AB and O",["A and B only","AB only","O only"],"Each combination of alleles has a 25% probability.");
M("D3.2","In incomplete dominance, the heterozygote:","Has a phenotype intermediate between the two homozygotes",["Looks identical to one parent","Shows both phenotypes separately","Is always lethal"],"Example: Mirabilis jalapa (four o’clock) red × white gives pink.");
M("D3.2","A carrier mother (XᴴXʰ) and unaffected father (XᴴY) have a son. What is the probability he has haemophilia?","50%",["25%","0%","100%"],"Sons get the father’s Y and one of the mother’s X chromosomes.");
M("D3.2","How is sex determined in humans?","Egg cells always carry X, and sperm carry X or Y; a Y-bearing sperm gives a male",["Eggs determine sex","Sperm always carry X","Sex is random after birth"],"The SRY gene on the Y chromosome triggers testis development.");
M("D3.2","In a pedigree, two unaffected parents have an affected child. The trait must be:","Recessive",["Dominant","Codominant","Always sex-linked dominant"],"Both parents must be carriers.");
M("D3.2","Skin colour in humans shows continuous variation because it is:","Polygenic, controlled by several genes and influenced by the environment",["Controlled by a single gene","Not inherited","Caused by only one allele"],"Polygenic traits vary continuously, while single-gene traits are discontinuous.");
M("D3.2","AaBb × AaBb (unlinked genes): what is the expected phenotype ratio? (HL)","9 : 3 : 3 : 1",["3 : 1","1 : 1 : 1 : 1","9 : 7"],"Independent assortment during meiosis gives this ratio.");
M("D3.2","AaBb × aabb (unlinked genes): what is the expected phenotype ratio? (HL)","1 : 1 : 1 : 1",["9 : 3 : 3 : 1","3 : 1","1 : 1"],"A dihybrid test cross reveals the gametes of the heterozygote.");
M("D3.2","What are linked genes? (HL)","Genes on the same chromosome that tend to be inherited together",["Genes on different chromosomes","Two alleles of one gene","Genes that never recombine"],"Crossing over can break linkage and produce recombinants.");
F("D3.2","Offspring with combinations of alleles different from either parent, produced by crossing over, are called _____.",["recombinants","recombinant"],"Recombinants are fewer than parental types when genes are linked.");
M("D3.2","What is the null hypothesis in a chi-squared test? (HL)","There is no significant difference between observed and expected results",["There is always a significant difference","Observed results are exactly equal","Expected results are impossible"],"If the calculated χ² exceeds the critical value at p = 0.05, the null hypothesis is rejected.");

/* D3.3 Homeostasis */
M("D3.3","What is homeostasis?","Maintenance of the internal environment within set limits despite external changes",["Constant external conditions","Growth in size","Reproduction"],"Variables include blood glucose, temperature, pH and water balance.");
M("D3.3","Why is negative feedback important in homeostasis?","It reverses a change, returning the variable to the set point from either side",["It amplifies changes","It stops all responses","It acts only once per day"],"It involves receptors, a control centre and effectors.");
M("D3.3","What happens when blood glucose rises?","Beta cells of the pancreas secrete insulin; cells take up glucose and the liver stores glycogen",["Alpha cells secrete insulin","Beta cells secrete glucagon","Adrenaline lowers glucose"],"Glucose concentration then falls to the set point.");
M("D3.3","What is the role of glucagon?","Secreted by alpha cells when glucose is low; stimulates glycogen breakdown in the liver",["Secreted by beta cells to lower glucose","Stimulates glycogen formation","Is a steroid hormone"],"Insulin and glucagon act antagonistically.");
M("D3.3","What causes type 1 diabetes?","Autoimmune destruction of beta cells, so little or no insulin is made",["Cells fail to respond to insulin","Too much insulin","Too much glucagon"],"It is treated by insulin injections.");
M("D3.3","What characterises type 2 diabetes?","Target cells become less responsive to insulin; obesity is a major risk factor",["Beta cells are destroyed by antibodies","Insulin is always absent","It is caused by a virus"],"Diet and exercise are important in management.");
M("D3.3","What happens when body temperature falls?","Vasoconstriction, shivering, hair erection and brown adipose tissue heat production",["Vasodilation and sweating","Sweating only","Increased blood flow to the skin"],"The hypothalamus is the control centre and peripheral thermoreceptors supply information.");
M("D3.3","What happens when body temperature rises?","Vasodilation and sweating",["Vasoconstriction","Shivering","Brown fat activation"],"Heat is lost by radiation and by evaporation of sweat.");
M("D3.3","Where does ultrafiltration occur, and what passes through? (HL)","The glomerulus into Bowman’s capsule; small molecules pass, but blood cells and large proteins do not",["The loop of Henle; everything passes","The collecting duct; only water","The bladder; urea only"],"The basement membrane acts as a filter.");
M("D3.3","What is the role of the proximal convoluted tubule? (HL)","Selective reabsorption of glucose, amino acids, and most water and salts",["Production of ADH","Ultrafiltration","Storage of urine"],"Cells have microvilli and many mitochondria for active transport.");
M("D3.3","How does the loop of Henle help conserve water? (HL)","The ascending limb pumps out salt, creating a high solute concentration in the medulla that draws water out of the collecting duct",["It pumps water out directly","It filters blood","It makes ADH"],"The countercurrent arrangement maintains a gradient.");
M("D3.3","How does ADH act when blood becomes too concentrated? (HL)","It increases aquaporins in collecting duct cells, increasing water reabsorption, so less, more concentrated urine is made",["It decreases water reabsorption","It makes urine more dilute","It stimulates glucose uptake"],"Osmoreceptors in the hypothalamus detect the change and the pituitary releases ADH.");
M("D3.3","During vigorous exercise, how does blood flow change?","It increases to skeletal muscles and skin, and decreases to the digestive system",["It increases to the gut","It decreases to muscles","It stays the same everywhere"],"Control of blood flow supports oxygen delivery and heat loss.");

/* D4.1 Natural selection */
M("D4.1","What does overproduction of offspring cause?","Competition for limited resources, so only some survive and reproduce",["No competition","All offspring survive","No variation"],"This is part of Darwin–Wallace theory.");
M("D4.1","What are the main sources of genetic variation?","Mutation, and sexual reproduction (crossing over, random orientation and random fertilization)",["Mutation only","Environmental effects only","Cloning"],"Variation must be heritable for evolution to occur.");
M("D4.1","What are selection pressures?","Abiotic factors such as temperature and biotic factors such as predation, competition and disease that affect survival and reproduction",["Only predators","Only the weather","Only human actions"],"They determine which characteristics are advantageous.");
F("D4.1","Fitness refers to an organism’s ability to survive and _____.",["reproduce"],"Reproductive success is what changes allele frequencies.");
M("D4.1","What is sexual selection?","Selection for traits that increase mating success, such as peacock tails, even if they reduce survival",["Selection for survival only","Selection by humans","Random change in alleles"],"Traits are chosen by or compete for mates.");
F("D4.1","The sum of all the alleles of all the genes in an interbreeding population is its _____.",["gene pool"],"Evolution is a change in allele frequencies in the gene pool.");
M("D4.1","What does directional selection do?","Favours one extreme phenotype, shifting the population mean",["Favours the average","Favours both extremes","Prevents variation"],"Example: antibiotic resistance in bacteria.");
M("D4.1","What does stabilising selection do?","Favours intermediate phenotypes and reduces variation",["Favours one extreme","Favours both extremes","Has no effect"],"Example: human birth weight.");
M("D4.1","What does disruptive selection do?","Favours both extreme phenotypes over intermediates and may lead to speciation",["Favours the intermediate","Favours one extreme","Stops evolution"],"Intermediates have lower fitness.");
M("D4.1","Hardy–Weinberg: which equation gives genotype frequencies for two alleles? (HL)","p² + 2pq + q² = 1",["p + q = 2","p² − q² = 1","2p + q = 1"],"With p + q = 1 for allele frequencies.");
M("D4.1","If q² = 0.16 for a recessive trait, what is the frequency of heterozygotes (2pq)? (HL)","0.48",["0.24","0.36","0.84"],"q = 0.4, p = 0.6, 2pq = 2 × 0.6 × 0.4 = 0.48.");
M("D4.1","Which conditions must hold for Hardy–Weinberg equilibrium? (HL)","No mutation, no gene flow, random mating, no selection, and a very large population",["Small population","Strong selection","Frequent migration"],"The equation is used as a null model.");
M("D4.1","What is genetic drift? (HL)","Random change in allele frequencies, stronger in small populations",["A predictable change due to selection","Movement of alleles by migration","Mutation caused by the environment"],"Founder effects and bottlenecks are examples.");
M("D4.1","Why do allele frequencies diverge in geographically isolated populations?","Different selection pressures and genetic drift act with no gene flow",["Gene flow increases","Mutations stop","Selection is identical"],"This can lead to speciation.");

/* D4.2 Stability and change */
M("D4.2","What does stability mean in an ecosystem?","The ability to remain relatively unchanged over time, or recover after disturbance",["No species ever change","No energy flow","Constant population sizes of every species"],"Stability is related to diversity and other conditions.");
M("D4.2","Which conditions are required for ecosystem stability?","Energy flow, nutrient recycling, genetic diversity and stable climatic variables",["Constant human intervention","Only one species","No decomposers"],"Models such as mesocosms help study these.");
M("D4.2","What is a tipping point?","A threshold beyond which a small change causes a large, often irreversible, shift to a different state",["A change that is easily reversed","A population peak","A seasonal change"],"Once passed, ecosystems may not return to the original state.");
M("D4.2","How could deforestation push the Amazon rainforest past a tipping point?","Loss of trees reduces rainfall recycling, so the forest may change to savanna",["More trees increase drought","Rainfall increases with deforestation","Soil becomes richer immediately"],"The cumulative effect reduces water cycling.");
M("D4.2","What is a keystone species?","A species with a disproportionately large effect on community structure relative to its abundance",["The most abundant species","The largest species","An invasive species"],"Removing it can destabilise the ecosystem.");
M("D4.2","Sea otters eat sea urchins that graze kelp. What happens if otters are removed?","Urchins increase and overgraze the kelp forest",["Kelp increases","Urchins decline","Nothing changes"],"A classic example of a keystone species.");
M("D4.2","What is the sequence of eutrophication?","Nutrient run-off → algal bloom → light blocked → plants die → decomposers use oxygen → hypoxia",["Oxygen increase → fish increase → nutrients fall","Algae die → nutrients fall → oxygen rises","Nutrients fall → algae bloom"],"Fertiliser run-off is a common cause.");
M("D4.2","What is biomagnification?","Increasing concentration of a non-biodegradable toxin at higher trophic levels",["Dilution of toxins up a food chain","Decomposition of toxins","Increase in biomass"],"Examples: mercury and DDT.");
M("D4.2","Why are microplastics a problem in food chains?","They are ingested, can block digestive tracts, and may carry toxins up the food chain",["They fertilise plants","They are digested completely","They stop eutrophication"],"Plastics do not biodegrade readily.");
M("D4.2","What is the first stage of primary succession? (HL)","Pioneer species colonise bare rock or new land with no soil",["A climax community appears","Mature forest grows","Grazing begins"],"Pioneers modify the environment, enabling other species.");
M("D4.2","What generally happens during primary succession? (HL)","Species diversity, soil depth, biomass and nutrient content increase",["Diversity decreases","Soil is lost","Biomass falls"],"Succession leads towards a stable climax community.");
M("D4.2","What is a climax community? (HL)","A stable, self-perpetuating community in equilibrium with its environment",["A pioneer community","A community that changes constantly","A community with no producers"],"The climax community depends on climate and soil.");
M("D4.2","What is arrested succession? (HL)","Succession halted by an ongoing factor such as grazing, burning or mowing",["Succession reaching climax","Succession reversing","Succession accelerated by fertiliser"],"Example: grassland maintained by grazing.");
M("D4.2","What is cyclical succession? (HL)","Communities pass through repeating phases, for example heathland regeneration after fire or gaps",["Succession that stops","One-way change to a climax only","Seasonal migration"],"Cyclical changes also occur in forest gaps.");

/* D4.3 Climate change */
M("D4.3","Which are the main anthropogenic causes of rising greenhouse gases?","CO₂ from fossil fuel combustion and deforestation, and methane from livestock, rice paddies and landfills",["Volcanoes only","Ozone depletion","Nitrogen fixation"],"Rising concentrations enhance the greenhouse effect.");
M("D4.3","What is the greenhouse effect?","Gases absorb and re-emit long-wave infrared radiation from Earth, warming the atmosphere",["Gases reflect all sunlight","Gases cool the Earth","Heat is trapped by oxygen only"],"CO₂, methane and water vapour are greenhouse gases.");
M("D4.3","Which is an example of a positive feedback loop in climate change?","Melting ice reduces albedo, so more heat is absorbed and more ice melts",["Warming increases ice formation","More CO₂ means more cooling","Clouds always reflect heat"],"Positive feedback amplifies change.");
M("D4.3","What happens as permafrost thaws?","Trapped methane and CO₂ are released, enhancing warming",["Carbon is stored faster","Nothing is released","Oxygen is released"],"This is another positive feedback loop.");
M("D4.3","What is the tipping point for boreal forests?","A change from net carbon sink to net carbon source due to fires, pests and decomposition",["A change to tundra to forest sink","Increased photosynthesis only","No change"],"Warming and drought make fires and insect outbreaks more common.");
M("D4.3","What are the effects of melting sea ice?","Loss of habitat for ice-dependent species such as polar bears and ice algae, and reduced albedo",["Habitat gain for polar species","Cooling of the Arctic","No effect on wildlife"],"Polar habitats are changing quickly.");
M("D4.3","How does climate change affect ocean currents and nutrients?","It can alter circulation and upwelling, changing nutrient distribution and productivity",["It speeds up all nutrient cycling","It has no effect","It increases nutrients everywhere"],"Fisheries and marine food webs depend on nutrient-rich upwelling.");
M("D4.3","What are range shifts?","Species moving toward the poles or to higher altitudes as temperatures rise",["Species moving toward the equator","Seasonal changes in population","Changes in chromosome number"],"Temperate species move, while coral reefs may decline.");
M("D4.3","What causes coral bleaching?","Warm water stresses corals so they expel their symbiotic zooxanthellae",["Cold water","Excess oxygen","Excess fish"],"Without algae, corals lose colour and food.");
M("D4.3","Which approach sequesters carbon?","Afforestation, forest regeneration and restoring peat-forming wetlands",["Burning biomass","Draining peatlands","Clearing forests"],"Carbon sequestration removes CO₂ and stores it.");
F("D4.3","The timing of seasonal biological events, such as flowering and migration, is called _____.",["phenology"],"Climate change alters phenology.");
M("D4.3","Which is an example of phenological mismatch?","Caterpillars peak earlier than chick hatching, so birds miss the food peak",["Caterpillars and chicks both time perfectly","Birds migrate later than usual with no effect","Flowers bloom with no pollinators needed"],"Mismatches can reduce reproductive success.");
M("D4.3","How can climate change act as a selection pressure?","Changing conditions favour heritable traits suited to the new climate, driving evolution",["It stops evolution","It causes acquired traits to be inherited","It removes variation instantly"],"Warming can change which traits give an advantage.");

PM("design","Why should each value of the independent variable be repeated several times?","To identify anomalies, calculate a mean and improve reliability",["To change the independent variable each time","To make the results more accurate in every case","To avoid needing a control"],"Repeats reduce the influence of random error and allow the spread of the data to be assessed.");

PM("stats","What does the standard deviation of a data set measure?","How spread out the data are around the mean",["The most common value","The difference between the largest and smallest values only","How accurate the mean is compared with the true value"],"A larger standard deviation means greater variability. It is calculated about the mean.");
PM("stats","A t-test comparing two means gives p = 0.03. What is the correct conclusion at the 5% significance level?","Reject the null hypothesis: the difference is statistically significant",["Accept the null hypothesis","The difference is certainly caused by the treatment","There is a 3% chance the data are accurate"],"p < 0.05 means the probability of such a difference occurring by chance is less than 5%, so the null hypothesis is rejected. It does not prove a cause.");
PM("stats","A statistical test gives p = 0.20. What does this suggest?","The difference could well be due to chance, so it is not statistically significant",["The treatment definitely has no effect","The result is highly significant","The sample was too large"],"p > 0.05 means that the null hypothesis cannot be rejected. It does not prove there is no effect.");

PM("stats","A trend line has R² = 0.95. What does this mean?","The line fits the data very well: about 95% of the variation in y is explained by the relationship with x",["The line is wrong 95% of the time","There is a 95% chance the data are repeatable","The correlation is negative"],"R² close to 1 indicates a strong fit between the trend line and the data. It does not by itself prove causation.");

/* ---------- typed-answer checking ---------- */
function norm(s){
  const t = String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['’]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ');
  return t.filter(w=>w && w!=='a' && w!=='an' && w!=='the').join(' ');
}
function lev(a,b){
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=[], cur=[]; for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1)); } prev=cur; }
  return prev[n];
}
const ALLANS = new Set();
BANK.forEach(b=>{ if(b.t==='f') b.ans.forEach(a=>ALLANS.add(norm(a))); });
function check(input, accepted){
  const n = norm(input); if(!n) return false;
  const forms = [n]; if(/s$/.test(n)) forms.push(n.replace(/s$/,'')); if(/es$/.test(n)) forms.push(n.replace(/es$/,''));
  const acc = accepted.map(norm);
  for(const f of forms){
    for(const m of acc){
      if(f===m) return true;
      const letters = /[a-z]/.test(m);
      if(letters && m.length>=3 && (' '+f+' ').indexOf(' '+m+' ')>=0) return true;
    }
  }
  for(const f of forms){
    if(ALLANS.has(f) && acc.indexOf(f)<0) return false;
    for(const m of acc){
      if(/[a-z]/.test(m) && m.length>=8 && Math.abs(m.length-f.length)<=2){
        const d = lev(m,f); if(d <= (m.length>=13 ? 2 : 1)) return true;
      }
    }
  }
  return false;
}

function scopeChapters(){
  if(S.scope==='all') return CHAPTERS.slice();
  if(S.scope==='unit') return CHAPTERS.filter(c=>CHUNIT[c]===S.unit);
  if(S.scope==='chapter') return [S.chapter];
  return [S.sub.slice(0,2)];
}
function scopePool(){
  if(S.sec!=='main') return secPool();
  if(S.scope==='sub') return MAIN.filter(b=>b.s===S.sub);
  const set = new Set(scopeChapters());
  return MAIN.filter(b=>set.has(b.ch));
}
function planCount(){
  const pool = scopePool();
  if(S.len==='full') return pool.length;
  if(S.sec!=='main') return Math.min(10, pool.length);
  if(S.scope==='sub') return Math.min(5, pool.length);
  return scopeChapters().reduce((n,c)=>n + Math.min(5, pool.filter(b=>b.ch===c).length), 0);
}
function roundRobin(groups, n){
  const gs = shuffle(groups.filter(g=>g.length)).map(g=>g.slice()); const out = []; let i = 0;
  while(out.length<n && gs.some(g=>g.length)){ const g = gs[i % gs.length]; if(g.length) out.push(g.shift()); i++; }
  return out;
}
function pickQuick(pool, n, key){
  key = key || (b=>b.s);
  const ks = Array.from(new Set(pool.map(key)));
  const unseen = ks.map(k=>shuffle(pool.filter(b=>key(b)===k && !S.seen.has(b.id))));
  const seen = ks.map(k=>shuffle(pool.filter(b=>key(b)===k && S.seen.has(b.id))));
  let out = roundRobin(unseen, n);
  if(out.length<n) out = out.concat(roundRobin(seen, n-out.length));
  return out;
}
function buildRun(){
  const pool = scopePool();
  if(S.len==='full') return shuffle(pool);
  if(S.sec!=='main') return shuffle(pickQuick(pool,10,b=>b.cat));
  if(S.scope==='sub') return shuffle(pickQuick(pool,5));
  let out = []; scopeChapters().forEach(c=>{ out = out.concat(pickQuick(pool.filter(b=>b.ch===c),5)); });
  return shuffle(out);
}
function setupKey(){
  if(S.sec!=='main') return S.sec+':'+S.cat+':'+S.len;
  const id = S.scope==='all' ? 'all' : S.scope==='unit' ? S.unit : S.scope==='chapter' ? S.chapter : S.sub;
  return S.scope+':'+id+':'+S.len;
}

/* ---------- diagrams, tables, charts ---------- */
function diagramSVG(d){
  if(d._svg) return d._svg;
  let h = '<svg viewBox="'+d.vb+'" role="img" aria-label="'+esc(d.title)+' diagram">'+d.body;
  d.labs.forEach(l=>{ h += '<line class="ld" x1="'+l[1]+'" y1="'+l[2]+'" x2="'+l[3]+'" y2="'+l[4]+'"/><circle class="ldd" cx="'+l[1]+'" cy="'+l[2]+'" r="2.6"/>'; });
  d.labs.forEach(l=>{ h += '<circle class="bdg" cx="'+l[3]+'" cy="'+l[4]+'" r="10.5"/><text class="bt" x="'+l[3]+'" y="'+(l[4]+4.2)+'">'+l[0]+'</text>'; });
  d._svg = h + '</svg>'; return d._svg;
}
function fmtN(v){ return String(+Number(v).toFixed(2)); }
function niceMax(m){ if(m<=0) return 1; const p = Math.pow(10, Math.floor(Math.log10(m))); const f = m/p; const n = f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*p; }
function chartSVG(c){
  const W=440, H=252, L=58, R=16, T=14, B=56, pw=W-L-R, ph=H-T-B;
  const cat = typeof c.x[0]==='string';
  let top = 0; c.s.forEach(s=>s.y.forEach((v,i)=>{ top = Math.max(top, v+(s.e?s.e[i]:0)); }));
  const ymin = c.ymin!=null ? c.ymin : 0, ymax = c.ymax!=null ? c.ymax : niceMax(top*1.05);
  const xmin = cat?0:(c.xmin!=null?c.xmin:Math.min.apply(null,c.x)), xmax = cat?1:(c.xmax!=null?c.xmax:Math.max.apply(null,c.x));
  const X = i => cat ? L+pw*(i+0.5)/c.x.length : L+pw*(c.x[i]-xmin)/((xmax-xmin)||1);
  const Y = v => T+ph*(1-(v-ymin)/(ymax-ymin));
  const col = ['var(--c1)','var(--c0)','var(--c3)','var(--c2)'];
  let g = '';
  for(let k=0;k<=5;k++){ const v = ymin+(ymax-ymin)*k/5, y = Y(v); g += '<line class="gl" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+fmtN(v)+'</text>'; }
  g += '<line class="ax" x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'"/><line class="ax" x1="'+L+'" y1="'+(T+ph)+'" x2="'+(W-R)+'" y2="'+(T+ph)+'"/>';
  if(cat) c.x.forEach((lab,i)=>{ g += '<text x="'+X(i)+'" y="'+(T+ph+15)+'" text-anchor="middle">'+esc(lab)+'</text>'; });
  else for(let k=0;k<=5;k++){ g += '<text x="'+(L+pw*k/5)+'" y="'+(T+ph+15)+'" text-anchor="middle">'+fmtN(xmin+(xmax-xmin)*k/5)+'</text>'; }
  function eb(cx,v,e){ return '<path class="eb" d="M'+cx+' '+Y(v-e)+'V'+Y(v+e)+'M'+(cx-4)+' '+Y(v+e)+'h8M'+(cx-4)+' '+Y(v-e)+'h8"/>'; }
  c.s.forEach((s,si)=>{
    const colr = col[si%4];
    if(c.kind==='bar'){
      const gw = pw/c.x.length*0.72, bw = gw/c.s.length;
      s.y.forEach((v,i)=>{ const x0 = X(i)-gw/2+si*bw; g += '<rect x="'+x0+'" y="'+Y(v)+'" width="'+(bw-3)+'" height="'+Math.max(0,Y(ymin)-Y(v))+'" style="fill:'+colr+'"/>'; if(s.e) g += eb(x0+(bw-3)/2, v, s.e[i]); });
    } else {
      if(c.kind==='line') g += '<polyline fill="none" style="stroke:'+colr+';stroke-width:2" points="'+s.y.map((v,i)=>X(i)+','+Y(v)).join(' ')+'"/>';
      s.y.forEach((v,i)=>{ g += '<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.6" style="fill:'+colr+'"/>'; if(s.e) g += eb(X(i), v, s.e[i]); });
    }
  });
  if(c.xl) g += '<text x="'+(L+pw/2)+'" y="'+(H-16)+'" text-anchor="middle" class="at">'+esc(c.xl)+'</text>';
  if(c.yl) g += '<text transform="translate(13 '+(T+ph/2)+') rotate(-90)" text-anchor="middle" class="at">'+esc(c.yl)+'</text>';
  if(c.s.length>1 && c.s[0].n){ let lx = L+4; c.s.forEach((s,si)=>{ g += '<rect x="'+lx+'" y="'+(H-10)+'" width="9" height="9" style="fill:'+col[si%4]+'"/><text x="'+(lx+13)+'" y="'+(H-2)+'">'+esc(s.n)+'</text>'; lx += 30+s.n.length*6; }); }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(c.alt||'Graph')+'">'+g+'</svg>';
}
function dataHTML(d){
  let h = '<div class="stim">';
  if(d.cap) h += '<div class="dcap">'+esc(d.cap)+'</div>';
  if(d.t) h += '<div class="tscroll"><table class="dt"><thead><tr>'+d.t.h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+d.t.r.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  if(d.c) h += '<div class="chart">'+chartSVG(d.c)+'</div>';
  return h + '</div>';
}
function stimHTML(q){
  let h = '';
  if(q.dia){ const d = DIAGBYID[q.dia]; h += '<div class="stim"><div class="dcap">'+esc(d.title)+'</div><div class="dia">'+diagramSVG(d)+'</div></div>'; }
  if(q.d) h += dataHTML(q.d);
  return h;
}
function checkNum(text, q){
  const m = String(text).replace(/,/g,'').replace(/\u2212/g,'-').match(/-?\d+(?:\.\d+)?(?:e-?\d+)?/i);
  return !!m && Math.abs(parseFloat(m[0]) - q.v) <= q.tol;
}

/* =========================================================
   GAME
   ========================================================= */
function startRun(list, kind){
  if(!list.length) return;
  const qs = list.map(q=>{
    const base = { orig:q, t:q.t, s:q.s, sec:q.sec, cat:q.cat, dia:q.dia, d:q.d, q:q.q, e:q.e };
    if(q.t==='f') return Object.assign(base, { ans:q.ans });
    if(q.t==='n') return Object.assign(base, { v:q.v, tol:q.tol, unit:q.unit, ans:[fmtN(q.v)+(q.unit?' '+q.unit:'')] });
    const idx = shuffle(q.o.map((_,i)=>i));
    return Object.assign(base, { opts:idx.map(i=>q.o[i]), correct:idx.indexOf(q.a) });
  });
  S.run = { qs:qs, kind:kind||'main', i:0, score:0, streak:0, best:0, res:[], locked:false, deadline:0, tick:null, limit:S.timer };
  renderQuestion();
}
function clearTick(){ if(S.run && S.run.tick){ clearInterval(S.run.tick); S.run.tick = null; } }
function cellsHTML(n, popIdx){ let h=''; for(let k=0;k<5;k++) h += '<span class="cell '+(k<n?'on':'')+' '+(k===popIdx?'pop':'')+'"></span>'; return h; }
function qHTML(q){ return esc(q).replace(/_____/g,'<span class="blank" aria-label="blank"></span>'); }
function subLabel(code){ return code+' '+(SUBNAME[code]||''); }
function tagLabel(q){ return q.sec==='main' ? subLabel(q.s) : (q.sec==='p1b'?'Paper 1B · ':'NOS · ')+(CATNAME[q.cat]||''); }

function renderQuestion(){
  const r = S.run, q = r.qs[r.i];
  r.locked = false;
  const segs = r.qs.map((_,j)=>'<span class="seg '+(j<r.i ? (r.res[j].ok?'ok':'bad') : (j===r.i?'cur':''))+'"></span>').join('');
  const kind = q.t==='m' ? (q.dia?'Diagram · multiple choice':'Multiple choice') : q.t==='n' ? 'Calculation' : (q.q.indexOf('_____')>=0 ? 'Fill in the blank' : (q.dia?'Diagram · name it':'Short answer'));
  const body = q.t==='m'
    ? '<div class="opts" id="opts">'+q.opts.map((t,i)=>'<button class="opt c'+i+'" data-opt="'+i+'"><span class="badge">'+'ABCD'.charAt(i)+'</span><span class="otext">'+esc(t)+'</span><span class="mark" aria-hidden="true"></span></button>').join('')+'</div>'
    : '<div class="typed"><label for="ans">'+(q.t==='n' ? 'Type a number'+(q.unit?' (in '+esc(q.unit)+')':'')+'. Give your working on paper if you need it.' : 'Type your answer (one word or short phrase)')+'</label><div class="trow"><input id="ans" type="text" '+(q.t==='n'?'inputmode="decimal" ':'')+'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="primary" data-act="submit" id="subBtn">Check</button></div></div>';
  app.innerHTML = '<div class="wrap">'+
    '<div class="topbar"><button class="ghost" data-act="quit">Quit</button><div class="stats">'+
      '<div class="stat"><span class="stat-n" id="score">'+r.score.toLocaleString()+'</span><span class="stat-l">points</span></div>'+
      '<div class="stat"><span class="cells" id="cells" aria-hidden="true">'+cellsHTML(Math.min(r.streak,5))+'</span><span class="stat-l" id="streakTxt">Streak '+r.streak+'</span></div>'+
    '</div></div>'+
    '<div class="segs" role="progressbar" aria-label="Question progress" aria-valuemin="1" aria-valuemax="'+r.qs.length+'" aria-valuenow="'+(r.i+1)+'">'+segs+'</div>'+
    '<div class="card"><div class="qmeta"><div class="tags"><span class="tag">'+esc(tagLabel(q))+'</span><span class="tag kind">'+kind+'</span></div><span>Question '+(r.i+1)+' of '+r.qs.length+'</span></div>'+
      (r.limit ? '<div class="timer" id="timer"><div class="timer-track"><div class="timer-bar" id="tbar"></div></div><span id="tnum">'+r.limit+'</span></div>' : '')+
      '<h2 class="qtext">'+qHTML(q.q)+'</h2>'+stimHTML(q)+'</div>'+
    body+
    '<div class="fb" id="fb" aria-live="polite"></div></div>';
  if(r.limit){ r.deadline = Date.now() + r.limit*1000; r.tick = setInterval(tickFn, 100); }
  window.scrollTo(0,0);
  if(q.t!=='m'){ const inp = document.getElementById('ans'); if(inp) inp.focus({preventScroll:true}); }
}

function tickFn(){
  const r = S.run; if(!r) return;
  const left = Math.max(0, (r.deadline - Date.now())/1000);
  const bar = document.getElementById('tbar'), num = document.getElementById('tnum'), box = document.getElementById('timer');
  if(bar) bar.style.width = (left/r.limit*100)+'%';
  if(num) num.textContent = Math.ceil(left);
  if(box) box.classList.toggle('low', left<=5);
  if(left<=0){ const q = r.qs[r.i]; if(q.t==='m') finish(false,{picked:-1,timeout:true}); else submitTyped(true); }
}

function submitTyped(timeout){
  const r = S.run; if(!r || r.locked) return;
  const q = r.qs[r.i], inp = document.getElementById('ans');
  const text = inp ? inp.value.trim() : '';
  if(!text && !timeout) return;
  const ok = !!text && (q.t==='n' ? checkNum(text,q) : check(text, q.ans));
  finish(ok, {text:text, timeout:!!timeout});
}

function finish(ok, info){
  const r = S.run; if(!r || r.locked) return;
  r.locked = true; clearTick();
  const q = r.qs[r.i];
  let frac;
  if(!r.limit) frac = 0.5; else if(info.timeout) frac = 0; else frac = Math.max(0,(r.deadline-Date.now())/1000)/r.limit;
  const prev = r.streak;
  const potential = 600 + Math.round(400*frac) + Math.min(prev,5)*50;
  let pts = 0;
  if(ok){ pts = potential; r.streak++; r.best = Math.max(r.best, r.streak); } else { r.streak = 0; }
  r.score += pts;
  S.seen.add(q.orig.id); saveSeen();
  r.res.push({ q:q, ok:ok, pts:pts, potential:potential, prev:prev, picked:info.picked, text:info.text, timeout:!!info.timeout });

  document.getElementById('score').textContent = r.score.toLocaleString();
  document.getElementById('cells').innerHTML = cellsHTML(Math.min(r.streak,5), ok?Math.min(prev,4):-1);
  document.getElementById('streakTxt').textContent = 'Streak '+r.streak;

  const last = r.i === r.qs.length-1;
  const noAnswer = info.timeout && (q.t==='m' || !info.text);
  const head = ok ? 'Correct' : (noAnswer ? 'Time’s up' : 'Not quite');
  let extra = '';
  if(q.t==='m'){
    const opts = document.getElementById('opts'); opts.classList.add('done');
    opts.querySelectorAll('.opt').forEach((b,k)=>{
      b.disabled = true; const mark = b.querySelector('.mark');
      if(k===q.correct){ b.classList.add('correct'); mark.textContent = '✓'; }
      else if(k===info.picked){ b.classList.add('wrong'); mark.textContent = '✕'; }
    });
    if(!ok) extra = '<p class="ans">Correct answer: '+esc(q.opts[q.correct])+'</p>';
  } else {
    const inp = document.getElementById('ans'), sb = document.getElementById('subBtn');
    if(inp){ inp.disabled = true; inp.classList.add(ok?'good':'bad'); } if(sb) sb.disabled = true;
    if(!ok) extra = '<p class="ans">'+(q.t==='n'?'Answer: ':'Accepted answer: ')+esc(q.ans[0])+'</p>'+(info.text ? '<p>Your answer: <i>'+esc(info.text)+'</i></p>' : '');
  }
  document.getElementById('fb').innerHTML =
    '<div class="fb-card '+(ok?'':'bad')+'" id="fbcard"><div class="fb-head"><span id="fbhead">'+head+'</span>'+(ok?'<span class="pts" id="fbpts">+'+pts+'</span>':'<span class="pts" id="fbpts"></span>')+'</div>'+
    extra+'<p>'+esc(q.e)+'</p>'+
    '<div class="fb-actions"><button class="primary" id="nextBtn" data-act="next">'+(last?'See results':'Next question')+'</button>'+
    (q.t!=='m' && !ok ? '<button class="ghost" id="ovBtn" data-act="override">I was right: count it</button>' : '')+'</div></div>';
  const nb = document.getElementById('nextBtn');
  nb.focus({preventScroll:true});
  nb.scrollIntoView({block:'nearest', behavior: reduced?'auto':'smooth'});
}

function override(){
  const r = S.run; if(!r) return;
  const last = r.res[r.res.length-1];
  if(!last || last.ok || last.q.t==='m') return;
  last.ok = true; last.overridden = true; last.pts = last.potential;
  r.streak = last.prev + 1; r.best = Math.max(r.best, r.streak); r.score += last.potential;
  document.getElementById('score').textContent = r.score.toLocaleString();
  document.getElementById('cells').innerHTML = cellsHTML(Math.min(r.streak,5), Math.min(last.prev,4));
  document.getElementById('streakTxt').textContent = 'Streak '+r.streak;
  document.getElementById('fbhead').textContent = 'Counted as correct';
  document.getElementById('fbpts').textContent = '+'+last.potential;
  const card = document.getElementById('fbcard'); if(card) card.classList.remove('bad');
  const inp = document.getElementById('ans'); if(inp){ inp.classList.remove('bad'); inp.classList.add('good'); }
  const ov = document.getElementById('ovBtn'); if(ov) ov.remove();
  const nb = document.getElementById('nextBtn'); if(nb) nb.focus({preventScroll:true});
}
function next(){ const r = S.run; if(!r) return; r.i++; if(r.i >= r.qs.length) renderResults(); else renderQuestion(); }

/* =========================================================
   RESULTS
   ========================================================= */
function countUp(el, to){
  if(reduced){ el.textContent = to.toLocaleString(); return; }
  const t0 = performance.now(), d = 900;
  (function f(t){ const p = Math.min(1,(t-t0)/d); el.textContent = Math.round(to*(1-Math.pow(1-p,3))).toLocaleString(); if(p<1) requestAnimationFrame(f); })(t0);
}
function renderResults(){
  const r = S.run;
  const total = r.res.length, right = r.res.filter(x=>x.ok).length;
  const acc = Math.round(right/total*100);
  const missed = r.res.filter(x=>!x.ok);
  const key = 'best:'+setupKey();
  const prevBest = Number(load(key)||0);
  const isBest = r.kind==='main' && r.score > prevBest;
  if(isBest) save(key, String(r.score));

  const isMain = S.sec==='main';
  const groupOf = x => isMain ? x.q.s : x.q.cat;
  const nGroups = new Set(r.res.map(groupOf)).size;
  const byCh = isMain && nGroups > 8;
  const by = {};
  r.res.forEach(x=>{ const c = byCh ? x.q.s.slice(0,2) : groupOf(x); by[c] = by[c] || {t:0,ok:0}; by[c].t++; if(x.ok) by[c].ok++; });
  const bars = Object.keys(by).sort().map(c=>{
    const p = Math.round(by[c].ok/by[c].t*100);
    const code = isMain ? c : '';
    const name = !isMain ? CATNAME[c] : byCh ? CHNAME[c] : SUBNAME[c];
    return '<div class="bar-row"><span class="nm"><i>'+code+'</i>'+esc(name||c)+'</span>'+
      '<div class="track"><div class="fill '+(p>=80?'':(p>=50?'mid':'low'))+'" style="width:'+p+'%"></div></div>'+
      '<span class="sc">'+by[c].ok+'/'+by[c].t+'</span></div>';
  }).join('');

  const title = acc>=90 ? 'Strong recall' : acc>=70 ? 'Solid, with a few gaps' : acc>=50 ? 'Getting there' : 'Worth another pass';
  const review = missed.length
    ? missed.map(x=>'<details class="miss"><summary>'+(x.q.dia?'['+esc(DIAGBYID[x.q.dia].title)+'] ':'')+qHTML(x.q.q).replace(/<span class="blank"[^>]*><\/span>/g,'_____')+'</summary>'+
        '<p class="ans"><b>'+(x.q.t==='m'?'Correct answer: ':'Answer: ')+'</b>'+esc(x.q.t==='m' ? x.q.opts[x.q.correct] : x.q.ans[0])+'</p>'+
        (x.text ? '<p>Your answer: <i>'+esc(x.text)+'</i></p>' : '')+'<p>'+esc(x.q.e)+'</p></details>').join('')
    : '<p>No misses. Clean sweep.</p>';

  const pool = scopePool(), seenIn = pool.filter(b=>S.seen.has(b.id)).length;
  app.innerHTML = '<div class="wrap">'+
    '<div class="res-hero"><h1>'+title+'</h1><div class="big" id="bigscore">0</div>'+
    '<div class="hint">points'+(isBest?'<span class="newbest">New best</span>':'')+'</div></div>'+
    '<div class="facts"><div class="fact"><b>'+right+'/'+total+'</b><span>correct</span></div>'+
    '<div class="fact"><b>'+acc+'%</b><span>accuracy</span></div>'+
    '<div class="fact"><b>'+r.best+'</b><span>longest streak</span></div></div>'+
    '<h2 class="sec-title">'+(!isMain?'By category':byCh?'By chapter':'By subtopic')+'</h2><div class="panel"><div class="bars">'+bars+'</div></div>'+
    '<h2 class="sec-title">Review your misses</h2>'+review+
    '<p class="hint" style="margin-top:18px">Coverage for this selection: '+seenIn+' of '+pool.length+' questions seen. A new round favours the rest.</p>'+
    '<div class="actions">'+
      (missed.length?'<button class="primary" data-act="retry">Retry missed</button>':'')+
      '<button class="'+(missed.length?'ghost':'primary')+'" data-act="again">New round</button>'+
      '<button class="ghost" data-act="menu">Back to menu</button></div></div>';
  countUp(document.getElementById('bigscore'), r.score);
  window.scrollTo(0,0);
}

/* =========================================================
   EVENTS
   ========================================================= */
app.addEventListener('click', function(e){
  const t = e.target.closest('[data-act],[data-opt],[data-unit],[data-chapter],[data-sub],[data-timer],[data-scope],[data-len],[data-sec],[data-cat]');
  if(!t) return;
  const d = t.dataset;
  if(d.opt !== undefined){ const r = S.run; if(r && !r.locked) finish(Number(d.opt)===r.qs[r.i].correct, {picked:Number(d.opt)}); return; }
  if(d.sec){ S.sec = d.sec; S.cat = 'all'; S.len = 'quick'; S.rst = false; renderMenu('[data-sec="'+d.sec+'"]'); return; }
  if(d.cat){ S.cat = d.cat; renderMenu('[data-cat="'+d.cat+'"]'); return; }
  if(d.scope){ S.scope = d.scope; S.rst = false; renderMenu('[data-scope="'+d.scope+'"]'); return; }
  if(d.unit){ S.unit = d.unit; renderMenu('[data-unit="'+d.unit+'"]'); return; }
  if(d.chapter){ S.chapter = d.chapter; renderMenu('[data-chapter="'+d.chapter+'"]'); return; }
  if(d.sub){ S.sub = d.sub; renderMenu('[data-sub="'+d.sub+'"]'); return; }
  if(d.len){ S.len = d.len; renderMenu('[data-len="'+d.len+'"]'); return; }
  if(d.timer !== undefined){ S.timer = Number(d.timer); renderMenu('[data-timer="'+S.timer+'"]'); return; }
  switch(d.act){
    case 'start': startRun(buildRun(),'main'); break;
    case 'submit': submitTyped(false); break;
    case 'next': next(); break;
    case 'override': override(); break;
    case 'quit': clearTick(); renderMenu(); break;
    case 'menu': renderMenu(); break;
    case 'again': startRun(buildRun(),'main'); break;
    case 'retry': startRun(S.run.res.filter(x=>!x.ok).map(x=>x.q.orig),'retry'); break;
    case 'reset':
      if(S.rst){ S.seen = new Set(); saveSeen(); S.rst = false; renderMenu(); }
      else { S.rst = true; renderMenu('[data-act="reset"]'); }
      break;
  }
});
document.addEventListener('keydown', function(e){
  const r = S.run; if(!r || r.locked) return;
  const q = r.qs[r.i];
  const kk = '1234'.indexOf(e.key) >= 0 ? '1234'.indexOf(e.key) : (e.key.length===1 ? 'abcd'.indexOf(e.key.toLowerCase()) : -1);
  if(q.t==='m' && kk>=0 && document.getElementById('opts')){
    const k = kk; if(k < q.opts.length) finish(k===q.correct, {picked:k});
  } else if(q.t!=='m' && e.key==='Enter' && e.target && e.target.id==='ans'){ e.preventDefault(); submitTyped(false); }
});

renderMenu();
</script>

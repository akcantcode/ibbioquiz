<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IB Biology HL Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500;1,6..72,600&amp;display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1F7F1; --surface:#FFFFFF; --ink:#18281E; --muted:#58695E; --line:#D6E4D9;
  --primary:#1B8449; --primary-ink:#FFFFFF; --soft:#E1F1E5;
  --deep:#14532D; --deep-ink:#FFFFFF;
  --good:#1B8449; --bad:#C23B2E;
  --c0:#C4503F; --c1:#23799A; --c2:#E2A82E; --c3:#2B8553; --c4:#B08968;
  --serif:'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2A21; --surface:#25382C; --ink:#EAF4EC; --muted:#A9C1B0; --line:#37523F;
    --primary:#5CC98C; --primary-ink:#0F2618; --soft:#2D4636;
    --deep:#A5E0BB; --deep-ink:#0F2618;
    --good:#5CC98C; --bad:#FF8F80;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2A21; --surface:#25382C; --ink:#EAF4EC; --muted:#A9C1B0; --line:#37523F;
  --primary:#5CC98C; --primary-ink:#0F2618; --soft:#2D4636;
  --deep:#A5E0BB; --deep-ink:#0F2618;
  --good:#5CC98C; --bad:#FF8F80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-size:17px; line-height:1.5; min-height:100vh}
h1,h2,h3{font-weight:800; font-family:'Hanken Grotesk','Hanken Grotesk',system-ui,sans-serif; margin:0; line-height:1.1; letter-spacing:-0.028em}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary); outline-offset:3px}
.wrap{max-width:900px; margin:0 auto; padding:22px 18px 56px}

.primary{background:var(--primary); color:var(--primary-ink); border:0; border-radius:14px; padding:14px 26px; font-weight:700; font-size:1.05rem; box-shadow:0 4px 0 rgba(12,52,28,.28); transition:transform .08s, box-shadow .08s}
.primary:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(12,52,28,.28)}
.primary[disabled]{opacity:.45; cursor:not-allowed}
.ghost{background:transparent; border:2px solid var(--line); border-radius:12px; padding:8px 16px; font-weight:600; color:var(--ink)}
.ghost:hover{border-color:var(--primary)}
.link{background:none; border:0; padding:4px 2px; color:var(--ptext); font-weight:600; text-decoration:underline}

/* ---------- menu ---------- */
.hero h1{font-size:clamp(2.5rem,8vw,4.4rem); font-weight:800; max-width:12ch}
.hero p{max-width:50ch; color:var(--muted); margin:14px 0 0; font-size:1.08rem}
.sec-title{font-size:1.25rem; font-weight:700; margin:32px 0 12px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px}
.seg-btns{display:inline-flex; flex-wrap:wrap; border:2px solid var(--line); border-radius:12px; overflow:hidden}
.seg-btns button{background:transparent; border:0; padding:9px 16px; font-weight:600}
.seg-btns button + button{border-left:2px solid var(--line)}
.seg-btns button[aria-pressed="true"]{background:var(--primary); color:var(--primary-ink)}
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px}
.tile{text-align:left; background:var(--bg); border:2px solid var(--line); border-radius:18px; padding:14px 14px 12px; display:flex; flex-direction:column; gap:2px; min-height:130px}
.tile .tl{font-family:'Hanken Grotesk',sans-serif; font-size:2.4rem; font-weight:800; line-height:1; color:var(--ptext)}
.tile .tn{font-weight:700; margin-top:6px; line-height:1.2}
.tile .tm{color:var(--muted); font-size:.9rem}
.tile[aria-pressed="true"]{border-color:var(--primary); background:var(--soft)}
.prow{margin-top:14px}
.plabel{font-weight:600; margin-bottom:6px}
.plabel b{color:var(--ptext); font-family:'Hanken Grotesk',sans-serif; font-size:1.15rem; margin-right:4px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{background:var(--bg); border:2px solid var(--line); border-radius:999px; padding:6px 13px; font-weight:600; font-size:.93rem; display:flex; gap:8px; align-items:center; text-align:left}
.chip .code{color:var(--ptext); font-weight:700}
.chip .n{color:var(--muted); font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--primary); background:var(--soft)}
.lenrow{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.lenopt{text-align:left; background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:16px 18px}
.lenopt b{display:block; font-family:'Hanken Grotesk',sans-serif; font-size:1.2rem; font-weight:800}
.lenopt span{color:var(--muted); font-size:.95rem}
.lenopt[aria-pressed="true"]{border-color:var(--primary); background:var(--soft)}
.row{display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between}
.start-row{margin-top:26px; display:flex; flex-wrap:wrap; gap:16px; align-items:center}
.hint{color:var(--muted); font-size:.93rem}
.cover{display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between}
.cover .track{flex:1 1 220px}
.foot{margin-top:34px; color:var(--muted); font-size:.9rem; max-width:62ch}

/* ---------- game ---------- */
.topbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px}
.stats{display:flex; gap:22px; align-items:center}
.stat{display:flex; flex-direction:column; align-items:flex-end; line-height:1.1}
.stat-n{font-family:'Hanken Grotesk',sans-serif; font-size:1.7rem; font-weight:800; font-variant-numeric:tabular-nums}
.stat-l{font-size:.82rem; color:var(--muted)}
.cells{display:flex; gap:4px; margin-bottom:3px}
.cell{width:14px; height:14px; border-radius:50%; border:2px solid var(--primary)}
.cell.on{background:var(--primary)}
.cell.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.segs{display:flex; gap:3px; margin-bottom:18px}
.seg{flex:1; height:6px; border-radius:3px; background:var(--line); min-width:2px}
.seg.cur{background:var(--muted)} .seg.ok{background:var(--good)} .seg.bad{background:var(--bad)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px}
.qmeta{display:flex; justify-content:space-between; gap:8px 12px; flex-wrap:wrap; color:var(--muted); font-size:.92rem; margin-bottom:12px}
.tags{display:flex; gap:8px; flex-wrap:wrap}
.tag{background:var(--soft); color:var(--ink); padding:3px 12px; border-radius:999px; font-weight:600}
.tag.kind{background:transparent; border:1.5px solid var(--line); color:var(--muted)}
.timer{display:flex; align-items:center; gap:12px; margin-bottom:16px}
.timer-track{flex:1; height:10px; background:var(--soft); border-radius:6px; overflow:hidden}
.timer-bar{height:100%; width:100%; background:var(--primary); border-radius:6px}
.timer.low .timer-bar{background:var(--bad)}
.timer.low #tnum{color:var(--bad)}
#tnum{font-family:'Hanken Grotesk',sans-serif; font-weight:800; font-size:1.3rem; min-width:2ch; text-align:right; font-variant-numeric:tabular-nums}
.qtext{font-size:clamp(1.25rem,3.4vw,1.7rem); font-weight:700; line-height:1.28; letter-spacing:-0.01em}
.blank{display:inline-block; min-width:5.5ch; height:1em; border-bottom:3px solid var(--primary); margin:0 .15em; vertical-align:baseline}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.opt{position:relative; display:flex; align-items:center; gap:14px; text-align:left; border:0; border-radius:14px; padding:16px; min-height:78px; color:#fff; font-weight:600; line-height:1.3; box-shadow:0 5px 0 rgba(12,52,28,.28); transition:transform .08s, box-shadow .08s, opacity .2s}
.opt.c0{background:var(--c0)} .opt.c1{background:var(--c1)} .opt.c2{background:var(--c2); color:#2A1D00} .opt.c3{background:var(--c3)}
.opt:not([disabled]):active{transform:translateY(4px); box-shadow:0 1px 0 rgba(12,52,28,.28)}
.badge{flex:none; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.24); display:grid; place-items:center}
.c2 .badge{background:rgba(42,29,0,.14)}
.badge svg{width:16px; height:16px; fill:currentColor}
.otext{flex:1}
.mark{flex:none; width:30px; height:30px; border-radius:50%; background:#fff; display:none; place-items:center; font-weight:800; font-size:1.05rem}
.opt.correct{box-shadow:0 0 0 4px var(--bg), 0 0 0 8px var(--good)}
.opt.correct .mark{display:grid; color:#1F8244}
.opt.wrong .mark{display:grid; color:#C8302E}
.opt.wrong{opacity:.7}
.opts.done .opt{cursor:default}
.opts.done .opt:not(.correct):not(.wrong){opacity:.38}
.typed{margin-top:16px}
.typed label{display:block; font-weight:600; margin-bottom:8px}
.trow{display:flex; gap:12px}
.trow input{flex:1; min-width:0; padding:14px 16px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-size:1.1rem}
.trow input:focus{border-color:var(--primary); outline:none}
.trow input.good{border-color:var(--good)} .trow input.bad{border-color:var(--bad)}
.fb{margin-top:20px}
.fb-card{background:var(--surface); border:1px solid var(--line); border-left:7px solid var(--good); border-radius:16px; padding:18px 20px}
.fb-card.bad{border-left-color:var(--bad)}
.fb-head{display:flex; align-items:baseline; gap:12px; font-family:'Hanken Grotesk',sans-serif; font-size:1.35rem; font-weight:800}
.fb-head .pts{color:var(--good); font-size:1.15rem}
.fb-card p{margin:8px 0 0; max-width:70ch}
.fb-card .ans{font-weight:700}
.fb-actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; align-items:center}

/* ---------- results ---------- */
.res-hero h1{font-size:clamp(2rem,6vw,3rem); font-weight:800}
.big{font-family:'Hanken Grotesk',sans-serif; font-weight:800; font-size:clamp(3.4rem,13vw,6rem); line-height:1; color:var(--ptext); font-variant-numeric:tabular-nums; margin:14px 0 4px}
.newbest{display:inline-block; background:var(--c2); color:#2A1D00; font-weight:700; border-radius:999px; padding:3px 14px; margin-left:8px; font-size:.95rem; vertical-align:middle}
.facts{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:22px}
.fact{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px}
.fact b{display:block; font-family:'Hanken Grotesk',sans-serif; font-size:1.7rem; font-weight:800}
.fact span{color:var(--muted); font-size:.92rem}
.bars{display:grid; gap:10px}
.bar-row{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 3.4rem; gap:12px; align-items:center; font-size:.97rem}
.bar-row .nm{font-weight:600}
.bar-row .nm i{font-style:normal; color:var(--ptext); margin-right:6px}
.track{height:12px; background:var(--soft); border-radius:6px; overflow:hidden}
.fill{height:100%; background:var(--good); border-radius:6px}
.fill.mid{background:var(--c2)} .fill.low{background:var(--bad)}
.fill.prog{background:var(--primary)}
.bar-row .sc{text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
details.miss{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:10px}
details.miss summary{cursor:pointer; font-weight:600}
details.miss p{margin:8px 0 0}
.actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:28px}

.tabs{margin-top:26px}
.tabs .seg-btns button{padding:11px 18px}
.stim{margin-top:16px}
.dcap{font-weight:600; color:var(--muted); font-size:.92rem; margin-bottom:6px}
.dia svg,.chart svg{width:100%; height:auto; max-width:600px; display:block}
.dia svg *{stroke:var(--ink); stroke-width:1.4; fill:none}
.dia svg text{fill:var(--ink); stroke:none; font-size:11px; font-family:'Hanken Grotesk',system-ui,sans-serif}
.dia svg .ka{fill:var(--c0); fill-opacity:.38} .dia svg .kb{fill:var(--c1); fill-opacity:.38}
.dia svg .kc{fill:var(--c2); fill-opacity:.5} .dia svg .kd{fill:var(--c3); fill-opacity:.38}
.dia svg .kp{fill:var(--c4); fill-opacity:.4} .dia svg .ks{fill:var(--surface)} .dia svg .kg{fill:var(--ink); fill-opacity:.14}
.dia svg .th{stroke-width:3} .dia svg .tk{stroke-width:5} .dia svg .dash{stroke-dasharray:4 3}
.dia svg .ld{stroke:var(--deep); stroke-width:1.2}
.dia svg .ldd{fill:var(--deep); stroke:none}
.dia svg .bdg{fill:var(--deep); stroke:none}
.dia svg .bt{fill:var(--deep-ink); stroke:none; font-size:12px; font-weight:700; text-anchor:middle}
.dia svg .sa{stroke:var(--c0); stroke-width:6; stroke-linecap:round}
.dia svg .sb{stroke:var(--c1); stroke-width:2.5}
.dia svg .sx{stroke:var(--c1); stroke-width:9; stroke-linecap:round}
.chart svg *{stroke:none}
.chart svg text{fill:var(--ink); font-size:10.5px; font-family:'Hanken Grotesk',system-ui,sans-serif}
.chart svg .gl{stroke:var(--line); stroke-width:1}
.chart svg .ax{stroke:var(--ink); stroke-width:1.4}
.chart svg .eb{stroke:var(--ink); stroke-width:1.4; fill:none}
.chart svg .at{font-weight:600; font-size:11px}
.tscroll{overflow-x:auto}
.dt{border-collapse:collapse; width:100%; font-size:.95rem}
.dt th,.dt td{border:1px solid var(--line); padding:6px 10px; text-align:center}
.dt th{background:var(--soft); font-weight:700}
/* ---------- restyle: bright, flat, green ---------- */
body{line-height:1.55; -webkit-font-smoothing:antialiased}
body::after{content:"ak"; position:fixed; left:18px; top:calc(12px + env(safe-area-inset-top,0px)); font-family:var(--serif); font-style:italic; font-weight:700; font-size:32px; letter-spacing:-0.01em; color:var(--ptext); opacity:.42; pointer-events:none; user-select:none; z-index:0}
.wrap{position:relative; z-index:1}
.hero{position:relative}
.hero h1{max-width:13ch}
.hero p{color:var(--muted)}
.sec-title{font-size:1.15rem; letter-spacing:-0.02em}
.panel,.card,.fact,.lenopt,details.miss,.fb-card{border-color:var(--line)}
.tile:hover,.chip:hover,.lenopt:hover{border-color:var(--primary)}
.chip{background:var(--surface)}
.tile{background:var(--surface)}
.tile[aria-pressed="true"],.chip[aria-pressed="true"],.lenopt[aria-pressed="true"]{background:var(--soft)}
.seg-btns{background:var(--surface)}
.seg-btns button{font-weight:600}
.tag{background:var(--soft); color:var(--deep)}
.timer-track{background:var(--soft)}
.track{background:var(--soft)}
.stat-n,#tnum,.big,.fact b{font-variant-numeric:tabular-nums}
@media (max-width:640px){ .hero h1{max-width:10ch} }
/* ---------- typography: serif for reading, italic for asides, bold sans for controls ---------- */
h1,h2,h3{font-family:var(--serif); font-weight:600; letter-spacing:-0.02em}
.hero h1{font-weight:600; font-size:clamp(2.7rem,8vw,4.7rem); line-height:1.02; letter-spacing:-0.035em}
.hero p{font-family:var(--serif); font-style:italic; font-size:1.2rem; line-height:1.5; max-width:44ch}
.sec-title{font-family:var(--serif); font-weight:700; font-size:1.45rem; letter-spacing:-0.02em}
.qtext{font-family:var(--serif); font-weight:600; font-size:clamp(1.4rem,3.6vw,1.85rem); line-height:1.28; letter-spacing:-0.012em}
.tile .tl{font-family:var(--serif); font-style:italic; font-weight:700}
.tile .tn,.lenopt b,.plabel,.chip,.seg-btns button,.tag,.primary,.ghost,.link{font-family:var(--sans)}
.tile .tn,.lenopt b{font-weight:700}
.lenopt b{font-size:1.1rem}
.plabel b{font-family:var(--serif); font-style:italic; font-size:1.2rem}
.chip{font-weight:600}
.chip .n{font-family:var(--serif); font-style:italic; font-weight:500}
.tile .tm,.lenopt span,.hint,.foot,.dcap,.stat-l,.qmeta>span,.cover>span{font-family:var(--serif); font-style:italic; font-size:1rem}
.foot{font-size:.98rem}
.tag{font-weight:700; font-style:normal; font-size:.88rem}
.tag.kind{font-family:var(--serif); font-style:italic; font-weight:500; font-size:.98rem}
.stat-n,#tnum{font-family:var(--sans); font-weight:800}
#streakTxt{font-family:var(--sans); font-style:normal; font-weight:700; font-size:.95rem; color:var(--ink)}
.cells{display:none}
.opt{font-family:var(--sans)}
.opt .otext{font-weight:700}
.badge{width:auto; height:auto; background:none!important; border-radius:0; display:block; font-family:var(--serif); font-style:italic; font-weight:700; font-size:1.55rem; line-height:1; min-width:1.2rem; opacity:.92}
.mark{background:none!important; width:auto; height:auto; font-size:1.5rem; font-weight:800; color:#fff!important}
.opt.correct .mark,.opt.wrong .mark{color:#fff!important}
.typed label{font-family:var(--serif); font-style:italic; font-weight:500; font-size:1.02rem}
.fb-head{font-family:var(--serif); font-weight:700; font-size:1.5rem}
.fb-head .pts{font-family:var(--sans); font-weight:800; font-size:1.05rem}
.fb-card p{font-family:var(--serif); font-size:1.1rem; line-height:1.55}
.fb-card .ans{font-family:var(--sans); font-weight:700; font-size:1rem}
.fb-card p i{font-style:italic}
.res-hero h1{font-weight:600}
.big{font-family:var(--serif); font-weight:700}
.fact b{font-family:var(--serif); font-weight:700}
.fact span{font-family:var(--serif); font-style:italic}
.bar-row .nm{font-family:var(--sans); font-weight:600}
.bar-row .nm i{font-family:var(--serif); font-style:italic; font-weight:700}
.bar-row .sc{font-family:var(--serif); font-style:italic}
details.miss summary{font-family:var(--serif); font-weight:600; font-size:1.08rem}
details.miss p{font-family:var(--serif); font-size:1.05rem}
.dt th{font-family:var(--sans); font-weight:700}
.dt td{font-family:var(--serif)}
.newbest{font-family:var(--sans); font-weight:700; font-style:normal}
/* ---------- palette: cream base; green = topics, navy = Paper 1B, butter = NOS ---------- */
:root{
  --bg:#FAF5E6; --surface:#FFFDF7; --beige:#F1E8D2; --ink:#1E2B23; --muted:#5C6A5F; --line:#E3DABF;
  --accent:#1B7A45; --ptext:var(--accent);
  --primary:#1B8449; --primary-ink:#FFFFFF; --soft:#E3F0DE; --deep:#14532D; --deep-ink:#FFFFFF; --edge:#1B8449;
  --good:#2B7A4B; --bad:#B9473B; --good-soft:#E4F0E1; --bad-soft:#F8E4DF;
  --c0:#2B8553; --c1:#5B8BD0; --c2:#E9BE3B; --c3:#2F4A7A; --c4:#B08968;
  --d0:#E07A6A; --d1:#5B8BD0; --d2:#E9BE3B; --d3:#6FA582; --d4:#B08968;
}
:root[data-sec="p1b"]{--accent:#2F4A7A; --primary:#2F4A7A; --primary-ink:#FFF8E4; --soft:#E3E8F2; --deep:#2F4A7A; --deep-ink:#FFFFFF; --edge:#2F4A7A}
:root[data-sec="nos"]{--accent:#8A6A00; --primary:#F3CF5B; --primary-ink:#2A2410; --soft:#FBF0C6; --deep:#6E5300; --deep-ink:#FFFFFF; --edge:#DDB43C}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2822; --surface:#23332B; --beige:#2C3B33; --ink:#F2F0E2; --muted:#AFC0B2; --line:#3A5043;
    --accent:#6FDB9F;
    --primary:#6FDB9F; --primary-ink:#0E2616; --soft:#27392F; --deep:#BDEFD1; --deep-ink:#0E2616; --edge:#6FDB9F;
    --good:#7CC79A; --bad:#FF8F80; --good-soft:#223C32; --bad-soft:#412A2E;
    --c0:#6FDB9F; --c1:#8FB3EA; --c2:#F3D37A; --c3:#7C9BD6; --c4:#D1AE86;
    --d0:#F28F7F; --d1:#7FA6E6; --d2:#F3D37A; --d3:#85C29B; --d4:#D1AE86;
  }
  :root:not([data-theme="light"])[data-sec="p1b"]{--accent:#9DB4EA; --primary:#8FA8E0; --primary-ink:#10203F; --soft:#26335A; --deep:#C6D4F5; --deep-ink:#10203F; --edge:#8FA8E0}

.tile,.lenopt{border:1px solid var(--line); border-radius:20px; background:var(--surface)}

details.miss summary{font-weight:500}
.fb-head{font-weight:600}

.opt{background:var(--surface)!important; color:var(--ink)!important; border:1px solid var(--line); border-left-width:5px; border-radius:14px; box-shadow:none; min-height:72px; font-family:var(--serif); font-weight:500; font-size:1.05rem}
.opt .otext{font-family:var(--serif); font-weight:500}
.opt.c0{border-left-color:var(--c0)} .opt.c1{border-left-color:var(--c1)} .opt.c2{border-left-color:var(--c2)} .opt.c3{border-left-color:var(--c3)}
.opt:not([disabled]):hover{background:var(--soft)!important}

.dia svg .ka{fill:var(--d0)} .dia svg .kb{fill:var(--d1)} .dia svg .kc{fill:var(--d2)} .dia svg .kd{fill:var(--d3)} .dia svg .kp{fill:var(--d4)}
.dia svg .sa{stroke:var(--d0)} .dia svg .sb{stroke:var(--d1)} .dia svg .sx{stroke:var(--d1)}
.dia svg .ld{stroke:var(--ink)} .dia svg .ldd,.dia svg .bdg{fill:var(--ink)} .dia svg .bt{fill:var(--surface)}

}

  *,*::before,*::after{transition:none!important; animation:none!important}
}

<body>
<div id="app"></div>

<script>
/* =========================================================
   QUESTION BANK  (M = multiple choice, F = fill-in-the-blank / short answer)
   M(subtopic, question, correct, [3 wrong options], explanation)
   F(subtopic, question, [accepted answers], explanation)
   ========================================================= */
const BANK = [], DIAG = [], DIAGBYID = {};
function M(s,q,c,w,e){ BANK.push({sec:'main',s:s,t:'m',q:q,o:[c].concat(w),a:0,e:e}); }
function F(s,q,ans,e){ BANK.push({sec:'main',s:s,t:'f',q:q,ans:ans,e:e}); }
/* Paper 1B: PM multiple choice, PF short answer, PN numeric (value, tolerance, unit); d = data stimulus */
function PM(cat,q,c,w,e,d){ BANK.push({sec:'p1b',cat:cat,t:'m',q:q,o:[c].concat(w),a:0,e:e,d:d}); }
function PF(cat,q,ans,e,d){ BANK.push({sec:'p1b',cat:cat,t:'f',q:q,ans:ans,e:e,d:d}); }
function PN(cat,q,v,tol,unit,e,d){ BANK.push({sec:'p1b',cat:cat,t:'n',q:q,v:v,tol:tol,unit:unit,e:e,d:d}); }
/* Nature of science */
function NM(cat,q,c,w,e){ BANK.push({sec:'nos',cat:cat,t:'m',q:q,o:[c].concat(w),a:0,e:e}); }
function NF(cat,q,ans,e){ BANK.push({sec:'nos',cat:cat,t:'f',q:q,ans:ans,e:e}); }
/* Diagrams: DG(id, subtopic, title, viewBox, body, labels) ; label = [letter, tipX, tipY, badgeX, badgeY, name, typedVariants, function, mode('f' = typed)] */
function DG(id,s,title,vb,body,labs,extra){ DIAG.push({id:id,s:s,title:title,vb:vb,body:body,labs:labs,extra:extra||[]}); }
/* ---- Unit A: questions carried over from round 1 ---- */
M("A1.1","Hydrogen bonds form between water molecules. Which statement explains why?","Oxygen carries a partial negative charge and hydrogen a partial positive charge, so neighbouring molecules attract each other",["Oxygen and hydrogen share electrons equally, so the non-polar molecules cluster together","Hydrogen atoms transfer electrons to oxygen, forming ions that attract each other","Covalent bonds form between the oxygen atoms of neighbouring molecules"],"Oxygen is more electronegative, so it pulls the shared electrons closer. Water is therefore polar: δ– on the oxygen and δ+ on each hydrogen. The δ+ hydrogen of one molecule is attracted to the δ– oxygen of another, forming a hydrogen bond.");
M("A1.1","Which statement correctly distinguishes cohesion from adhesion?","Cohesion is attraction between water molecules; adhesion is attraction between water and other polar or charged surfaces",["Cohesion is attraction between water and other surfaces; adhesion is attraction between water molecules","Cohesion only occurs in liquid water; adhesion only occurs in ice","Cohesion depends on hydrophobic interactions; adhesion depends on covalent bonds"],"Cohesion is water–water hydrogen bonding (unbroken water columns in xylem, surface tension). Adhesion is attraction between water and other polar or charged surfaces (water sticking to cellulose in xylem walls).");
M("A1.1","A large lake changes temperature far more slowly than the air above it. Which property of water is the main reason?","High specific heat capacity",["Excellent solvent ability","Lower density when frozen","Strong adhesion to the lake bed"],"Much of the energy absorbed goes into breaking hydrogen bonds rather than increasing the kinetic energy of the molecules, so temperature rises slowly. This high specific heat capacity buffers aquatic habitats against temperature change.");
M("A1.1","Which substance is carried in blood plasma simply dissolved in water, without needing to be packaged in a lipoprotein?","Glucose",["Cholesterol","Triglycerides","Vitamin A (a fat-soluble vitamin)"],"Glucose is polar (many –OH groups), so it is hydrophilic and dissolves in plasma. Cholesterol, triglycerides and fat-soluble vitamins are hydrophobic, so they need lipoproteins or carrier proteins.");
M("A1.2","Which bond joins adjacent nucleotides within one strand of DNA?","A covalent phosphodiester bond between the sugar of one nucleotide and the phosphate of the next",["A hydrogen bond between the phosphate groups of adjacent nucleotides","An ionic bond between adjacent bases","A peptide bond between the sugar and the base"],"Phosphodiester bonds (covalent) link the 3′ carbon of one deoxyribose to the 5′ phosphate of the next nucleotide, forming the sugar–phosphate backbone. Hydrogen bonds act between complementary bases on opposite strands.");
M("A1.2","A double-stranded DNA sample contains 28% adenine. What percentage of its bases is cytosine?","22%",["28%","44%","72%"],"A pairs with T, so T = 28%. A + T = 56%, leaving 44% for G + C. G pairs with C, so each is 22% (Chargaff’s rule).");
M("A1.2","Which row correctly describes RNA compared with DNA?","Ribose sugar, uracil instead of thymine, usually single-stranded",["Deoxyribose sugar, uracil instead of thymine, usually double-stranded","Ribose sugar, thymine instead of uracil, usually double-stranded","Deoxyribose sugar, thymine, usually single-stranded"],"RNA contains ribose, uses uracil in place of thymine and is usually single-stranded. DNA contains deoxyribose and thymine and is usually double-stranded.");
M("A1.2","Which feature of DNA structure makes accurate replication possible?","Complementary base pairing (A–T, G–C), so each strand can act as a template",["The antiparallel strands having identical base sequences","Purines pairing with other purines to keep the helix a constant width","The negatively charged backbone repelling incorrect nucleotides"],"Adenine pairs only with thymine and guanine only with cytosine (via hydrogen bonds), so each old strand dictates the sequence of the new one: semi-conservative replication. The strands are complementary, not identical, and purine–pyrimidine pairing is what keeps the width constant.");
M("A2.1","Miller and Urey passed sparks through a mixture of water vapour, methane, ammonia and hydrogen. What did the experiment support?","Organic molecules such as amino acids can form abiotically from inorganic substances",["Complete cells can arise spontaneously from non-living matter within days","Life on Earth began with molecules delivered by meteorites","The early atmosphere was rich in oxygen"],"They detected amino acids and other organic compounds, showing abiotic synthesis is plausible under simulated early-Earth conditions. It did not produce cells, and the exact atmospheric mix they used is now debated.");
M("A2.1","Why is RNA a strong candidate for the first genetic material?","It can store information and also catalyse reactions as ribozymes",["It is more chemically stable than DNA","It is double-stranded, allowing semi-conservative replication","It can be translated directly into protein without ribosomes"],"The RNA world hypothesis: RNA can carry genetic information and act as a catalyst, so it could have self-replicated before DNA and proteins evolved. DNA is more stable, which is why it later became the main information store.");
M("A2.1","Which observation is evidence for a last universal common ancestor (LUCA)?","All living organisms share a near-universal genetic code and a set of core genes",["All living organisms contain mitochondria","Fossils of LUCA have been found in the oldest sedimentary rock","All living organisms carry out photosynthesis"],"The shared genetic code and conserved genes (for example those for ribosomal components) across all three domains point to common ancestry. Mitochondria and photosynthesis are not universal, and no LUCA fossil has been found.");
M("A2.1","Which observation best supports the endosymbiotic origin of mitochondria?","They contain naked circular DNA and 70S ribosomes, and divide by binary fission",["They are surrounded by a single membrane and contain 80S ribosomes","They are found only in cells that lack a nucleus","Their DNA is linear and wrapped around histones"],"Naked circular DNA, 70S ribosomes and binary fission are prokaryote-like features, consistent with mitochondria descending from engulfed aerobic bacteria. Their double membrane also fits the engulfment idea.");
M("A2.2","Which feature is characteristic of prokaryotic cells?","DNA that is not enclosed by a nuclear envelope",["Mitochondria","A membrane-bound nucleus","80S ribosomes"],"Prokaryotes have a nucleoid region containing naked DNA, no membrane-bound organelles and smaller 70S ribosomes.");
M("A2.2","A drawing of a cell is 45 mm long. Its scale bar is 10 mm long and represents 5 μm. What is the actual length of the cell?","22.5 μm",["9 μm","225 μm","4.5 μm"],"Magnification = 10 mm ÷ 0.005 mm = ×2000. Actual size = image size ÷ magnification = 45 mm ÷ 2000 = 0.0225 mm = 22.5 μm. Remember I = A × M.");
M("A2.2","A cuboid cell doubles the length of each of its sides. What happens to its surface area to volume ratio?","It halves",["It doubles","It stays the same","It increases fourfold"],"Surface area scales with length² (×4) but volume with length³ (×8), so SA:V halves. Example: a 2 μm cube gives 24/8 = 3:1, a 4 μm cube gives 96/64 = 1.5:1. A low SA:V limits exchange, which is why cells stay small or are folded or flattened.");
M("A2.2","A gland cell secretes a digestive enzyme. Which sequence shows the route of the enzyme through the cell?","Rough ER → Golgi apparatus → vesicle → plasma membrane",["Golgi apparatus → rough ER → vesicle → plasma membrane","Free ribosome → nucleus → Golgi apparatus → plasma membrane","Smooth ER → lysosome → plasma membrane"],"Proteins for export are made on ribosomes of the rough ER, travel in vesicles to the Golgi apparatus for modification and packaging, then leave in vesicles that fuse with the plasma membrane (exocytosis).");
M("A2.3","In the lysogenic cycle of a bacteriophage, what happens to the viral DNA?","It integrates into the host chromosome and is copied with it, without immediately killing the cell",["It destroys the host DNA and immediately assembles new virions","It stays outside the cell and is degraded","It is translated into capsid proteins by viral ribosomes"],"The viral DNA integrates as a prophage and is replicated each time the host divides. Later it may switch to the lytic cycle, when new virions are made and the cell lyses. Viruses have no ribosomes of their own.");
M("A2.3","Why are antibiotics ineffective against viral infections?","Viruses have no cell wall or metabolism of their own for antibiotics to target, and they replicate using host machinery",["Viruses have a cell wall made of a different material that antibiotics cannot digest","Viruses are too small for antibiotics to bind to","Antibiotics only work against eukaryotic pathogens"],"Antibiotics target bacterial structures and processes such as cell wall synthesis and 70S ribosomes. Viruses are acellular and rely on host cells, so those targets are absent. Antivirals instead block specific viral steps.");
M("A3.1","A horse and a donkey mate and produce a mule, which is sterile. What does this show?","Horses and donkeys are separate species, because their offspring are not fertile",["Horses and donkeys are the same species, because they can interbreed","Mules are a new species formed by sympatric speciation","Horses and donkeys differ only because of geographic separation"],"Under the biological species concept, a species is a group that can interbreed to produce fertile offspring. Sterile offspring show a reproductive barrier between two distinct species.");
M("A3.1","How does DNA barcoding help identify species?","By comparing a short, standardised gene sequence (such as COI in animals) with reference databases",["By sequencing the whole genome and counting the chromosomes","By comparing the shapes of preserved specimens","By measuring the percentage of GC base pairs in a sample"],"A short, standardised region such as COI (animals) or rbcL/matK (plants) varies enough between species to act as a barcode, and can identify specimens from tiny or damaged samples.");
M("A3.2","What does a node (branch point) on a cladogram represent?","A common ancestor from which two lineages diverged",["An extinct species included in the analysis","A point where two species hybridised","The moment a species became extinct"],"Each node is a hypothetical most recent common ancestor from which the descendant lineages diverged. Species that share a more recent node are more closely related.");
M("A3.2","Which evidence generally gives the most reliable cladogram for a group of species?","Base sequences of conserved genes",["External appearance, since it is easy to observe","The habitat of each species","The number of offspring each species produces"],"Sequence differences in DNA or proteins are objective and quantifiable, and accumulate over time. Appearance can mislead because unrelated species may evolve similar structures through convergent evolution.");
M("A4.1","Which of the following is NOT required for evolution by natural selection?","Characteristics acquired during an individual’s lifetime being passed to offspring",["Variation between individuals in a population","Heritability of that variation","Production of more offspring than can survive"],"Natural selection needs heritable variation and overproduction of offspring, leading to differential survival and reproduction. Inheritance of acquired characteristics is not required (and does not generally occur).");
M("A4.1","Which statement describes allopatric speciation?","A geographical barrier separates populations, gene flow stops, and divergence leads to reproductive isolation",["A population splits into two species within the same habitat through polyploidy","Two species merge into one through interbreeding","Individuals learn different behaviours without any genetic change"],"Allopatric speciation follows geographic separation. With no gene flow, each population experiences different selection pressures and mutations until they can no longer interbreed.");
M("A4.2","Which is an example of ex situ conservation?","Storing seeds in a seed bank",["Establishing a marine protected area","Creating wildlife corridors between forest fragments","Banning hunting inside a national park"],"Ex situ conservation takes place outside the natural habitat: seed banks, zoos, botanic gardens and captive breeding. The other options protect species in their habitat (in situ).");
M("A4.2","A community has three species with 5, 3 and 2 individuals. Using Simpson’s reciprocal index, D = N(N − 1) ÷ Σn(n − 1), what is D?","3.2",["0.31","28","10"],"N = 10, so N(N − 1) = 90. Σn(n − 1) = 5×4 + 3×2 + 2×1 = 28. D = 90 ÷ 28 ≈ 3.2. A higher D means greater diversity; the minimum value is 1 (one species only).");

/* ---- Unit A: new questions ---- */
/* A1.1 Water */
F("A1.1","The unequal sharing of electrons in the O–H bonds makes a water molecule _____.",["polar"],"Oxygen pulls electrons closer, giving partial charges (δ– on O, δ+ on H), so water is polar.");
M("A1.1","Pond skaters can walk on water without sinking. Which property makes this possible?","Surface tension, caused by cohesion between water molecules",["Adhesion between their legs and the pond bed","The low density of liquid water","The high solvent ability of water"],"Cohesive hydrogen bonds between surface molecules create surface tension, giving the surface a ‘skin’ that supports small organisms.");
M("A1.1","How does sweating cool the body?","Heat energy is absorbed from the skin to break hydrogen bonds as sweat evaporates",["Hydrogen bonds form as sweat reaches the skin, absorbing heat","Sweat has a low specific heat capacity so it carries heat away quickly","Salts in sweat absorb heat from the blood"],"Water has a high latent heat of vaporization: the most energetic molecules escape, taking heat with them and cooling the surface.");
M("A1.1","Compared with air, water as a habitat offers:","Greater buoyancy but higher viscosity, so more resistance to movement",["Lower buoyancy and lower viscosity","Greater buoyancy and lower viscosity","Lower buoyancy but higher viscosity"],"Water is denser, so it supports organisms, but its viscosity means swimming needs streamlining. It also has much higher thermal conductivity and specific heat than air.");
F("A1.1","Water is drawn into narrow spaces such as soil pores and plant cell walls by _____ action.",["capillary"],"Capillary action results from adhesion to polar or charged surfaces combined with cohesion between water molecules.");
M("A1.1","Which hypothesis is given for the origin of water on Earth?","Water was delivered by asteroids that collided with the early Earth",["Water was produced by the first cells during respiration","Water formed when cyanobacterial oxygen burned atmospheric methane","Water was released only when the Moon formed"],"Asteroid delivery is the hypothesis in the syllabus. Earth then retained the water through its gravity and temperatures low enough for water vapour to condense.");
M("A1.1","Why has Earth kept its liquid water rather than losing it to space?","Gravity holds water vapour and the temperature is low enough for it to condense",["Hydrogen bonds between water and rock hold it in place","Earth’s magnetic field turns vapour into ice","The Moon’s gravity prevents escape"],"Sufficient gravity retains the atmosphere and water vapour, and Earth is cool enough for condensation into oceans.");
F("A1.1","Planets in the ‘Goldilocks zone’ orbit at a distance where temperatures allow _____ water to exist.",["liquid"],"The search for extraterrestrial life focuses on planets where liquid water could exist.");

/* A1.2 Nucleic acids */
F("A1.2","DNA nucleotides each contain deoxyribose, a phosphate group and a nitrogenous _____.",["base"],"A nucleotide = pentose sugar + phosphate group + nitrogenous base.");
M("A1.2","Which pair of bases are both purines?","Adenine and guanine",["Cytosine and thymine","Adenine and thymine","Guanine and cytosine"],"Purines (A, G) have a double-ring structure; pyrimidines (C, T, U) have a single ring.");
F("A1.2","Which nitrogenous base is found in RNA but not in DNA?",["uracil"],"Uracil replaces thymine in RNA.");
M("A1.2","The two strands of a DNA double helix run in opposite directions, one 5′→3′ and the other 3′→5′. This is described as being:","Antiparallel",["Parallel","Semi-conservative","Palindromic"],"The antiparallel arrangement allows complementary base pairing along the whole molecule and has consequences for replication.");
M("A1.2","Why does pairing a purine with a pyrimidine help stabilise the DNA helix?","Every base pair has the same width, so the helix keeps a constant diameter",["Purines and pyrimidines form covalent bonds with each other","Pyrimidine–pyrimidine pairs are too wide to fit in the helix","It allows the sugar–phosphate backbone to be hydrophobic"],"A–T and G–C pairs are each one double-ring plus one single-ring base, so the width is uniform. Two purines would be too wide and two pyrimidines too narrow.");
M("A1.2","Which describes a nucleosome?","DNA wrapped around a core of eight histone proteins, with a further histone attached to linker DNA",["A single histone coated with RNA","Eight DNA molecules wound around one histone","A ribosomal subunit bound to mRNA"],"Nucleosomes are the basic units of chromatin packing in eukaryotes.");
M("A1.2","In the Hershey–Chase experiment, phages with ³²P-labelled DNA infected bacteria. What was found?","Radioactivity was inside the bacterial cells, showing DNA enters and carries the genetic information",["Radioactivity stayed in the phage coats, showing DNA is not genetic material","Radioactivity was found only in the bacterial cell wall","No radioactivity was detected anywhere"],"Phages labelled with ³⁵S (protein) left their radioactivity outside the cells, whereas ³²P (DNA) entered, so DNA is the genetic material.");
M("A1.2","Why can DNA store a virtually limitless amount of information?","A molecule can be any length and the four bases can occur in any sequence",["Every gene must be the same length","The bases can only occur in a fixed order","DNA contains twenty different bases"],"With four bases, the number of possible sequences rises exponentially with length. DNA stores data very compactly.");
F("A1.2","The universality of the genetic code is evidence that all living things share a common _____.",["ancestor","ancestry","common ancestor"],"Almost all organisms use the same codon–amino acid assignments, pointing to universal common ancestry.");
M("A1.2","Why were Chargaff’s data on base ratios in many different species important?","They showed A = T and G = C in all of them, a pattern later explained by complementary base pairing",["They proved DNA is made of protein","They showed all species have identical DNA","They showed adenine pairs with guanine"],"Data from diverse life forms supported (and could have falsified) the base-pairing rule, which fitted the double-helix model.");

/* A2.1 Origins of cells (HL) */
M("A2.1","Which condition was absent from the early Earth’s atmosphere?","Free oxygen, and therefore ozone",["Carbon dioxide","Methane","Water vapour"],"Without ozone, UV light penetrated to the surface, and high CO₂ and methane made it hot. Free oxygen came later from photosynthesis.");
M("A2.1","Which set of requirements is needed for the spontaneous origin of cells?","Catalysis, self-replication of molecules, self-assembly and compartmentalization",["Photosynthesis, aerobic respiration and a nucleus","A cell wall, mitochondria and ribosomes","Free oxygen, ozone and a nucleus"],"Cells needed molecules that catalyse reactions, copy themselves, assemble spontaneously and be enclosed in a compartment.");
M("A2.1","How might fatty acids have contributed to the origin of cells?","They could coalesce spontaneously into spherical bilayer vesicles, forming compartments",["They catalysed the replication of RNA","They supplied the genetic code","They produced oxygen"],"Amphipathic fatty acids and phospholipids self-assemble into bilayers in water, forming protocell-like vesicles.");
F("A2.1","Evidence suggests that LUCA evolved near hydrothermal _____.",["vents","vent"],"Fossils in ancient vent precipitates and conserved genes support a hydrothermal vent origin.");
M("A2.1","Why are viruses considered non-living by many biologists?","They have no metabolism and can only replicate inside host cells",["They have no genetic material","They are too small to contain proteins","They never mutate"],"Living things carry out the processes of life independently. Viruses are obligate parasites and cannot do so outside a host.");
M("A2.1","How are the dates of the first cells and LUCA estimated?","From fossil evidence (such as stromatolites and microfossils) and genetic analysis",["By counting growth rings in ancient rocks","By measuring modern mutation rates in a single species","From written historical records"],"Fossils and radiometric dating give minimum ages, and sequence data with molecular clocks give estimates of divergence times.");

/* A2.2 Cell structure */
F("A2.2","According to cell theory, all living organisms are composed of one or more _____.",["cells","cell"],"Cells are the basic structural unit of life, so a newly discovered organism can be predicted to be made of cells.");
M("A2.2","Which is an exception to cell theory?","Striated muscle fibres, which are large and multinucleate",["Bacteria, which lack a nucleus","Root hair cells","White blood cells that move by amoeboid motion"],"Striated muscle, giant algae (Acetabularia) and aseptate fungal hyphae are larger or structured differently from the typical single-nucleus cell.");
M("A2.2","Which technique uses antibodies linked to fluorescent dyes to locate specific proteins in cells?","Immunofluorescence",["Freeze fracture","Differential centrifugation","Gel electrophoresis"],"Immunofluorescence uses fluorescent antibodies, visualised in a fluorescence light microscope, to show where particular proteins are.");
M("A2.2","What is a key advantage of cryogenic electron microscopy (cryo-EM)?","It shows biological molecules in a near-native state, flash-frozen without staining or chemical fixing",["It allows living cells to be watched dividing","It uses visible light to give true-colour images","It is cheaper and simpler than light microscopy"],"Rapid freezing preserves natural structure, allowing high-resolution 3D models of proteins and viruses.");
M("A2.2","Which pair of features is found in plant cells but not typically in animal cells?","A cellulose cell wall and a large central sap vacuole",["Centrioles and cilia","A plasma membrane and cytoplasm","A nucleus and mitochondria"],"Plants also have chloroplasts. Animal cells have centrioles and no cell wall, and they have only small vacuoles.");
F("A2.2","Prokaryotic ribosomes have a sedimentation coefficient of _____S.",["70","70s"],"Prokaryotes have 70S ribosomes. The eukaryotic cytoplasm has 80S ribosomes (mitochondria and chloroplasts also have 70S).");
M("A2.2","Which cell is anucleate (has no nucleus) when mature?","Phloem sieve tube element",["Skeletal muscle fibre","Aseptate fungal hypha","Root hair cell"],"Sieve tube elements (and mammalian red blood cells) lose their nuclei. Skeletal muscle and aseptate hyphae are multinucleate.");
F("A2.2","The sum of all the enzyme-catalysed reactions in an organism is called its _____.",["metabolism"],"Metabolism is one of the processes of life, along with homeostasis, nutrition, movement, excretion, growth, response and reproduction.");
M("A2.2","Which structure is made of microtubules and microfilaments and gives eukaryotic cells shape and allows movement of organelles?","The cytoskeleton",["The cell wall","The nuclear envelope","A lysosome"],"The cytoskeleton also helps move chromosomes and vesicles.");
M("A2.2","Which is an advantage of multicellularity? (HL)","Cells can differentiate, so the organism can grow large with division of labour",["Cells no longer need to carry out the processes of life","The whole organism’s surface area to volume ratio increases","All cells stay identical so any cell can replace another"],"Specialised cells and tissues allow larger size, more complex bodies and greater efficiency, with emergent properties.");

/* A2.3 Viruses (HL) */
M("A2.3","Which feature is common to all viruses?","A nucleic acid genome enclosed in a protein capsid",["A plasma membrane and cytoplasm","Ribosomes for protein synthesis","Mitochondria that supply ATP"],"Some viruses also have an envelope. All have few or no enzymes and rely on a host for energy and protein synthesis.");
F("A2.3","The protein coat that surrounds a virus’s genetic material is called the _____.",["capsid"],"The capsid is made of protein subunits (capsomeres).");
M("A2.3","Which statement about viral genetic material is correct?","It may be DNA or RNA, and either single- or double-stranded",["It is always double-stranded DNA","It is always single-stranded RNA","It is always circular DNA"],"Bacteriophage λ has dsDNA, coronaviruses and HIV have ssRNA, and other viruses have dsRNA or ssDNA.");
M("A2.3","In the lytic cycle of bacteriophage λ, what happens soon after the viral DNA enters the host cell?","Host machinery replicates the viral DNA and makes capsid proteins",["The viral DNA is inserted into the host chromosome as a prophage","The host cell bursts before any viral components are made","Viral ribosomes translate viral mRNA"],"The lytic cycle: attachment, injection, replication and synthesis using the host’s resources, assembly of new phages, then lysis to release them.");
F("A2.3","In the lysogenic cycle, viral DNA integrated into the host chromosome is called a _____.",["prophage"],"The prophage is copied each time the host divides and may later be triggered into the lytic cycle.");
M("A2.3","HIV is a retrovirus. Which enzyme allows it to make DNA from its RNA genome?","Reverse transcriptase",["DNA ligase","Helicase","Rubisco"],"Reverse transcriptase makes DNA from the RNA genome, which can integrate into host DNA.");
M("A2.3","Why do viruses such as influenza and HIV evolve so rapidly?","High mutation rates (RNA replication lacks proofreading), huge numbers of progeny and short generation times",["They have efficient proofreading enzymes","They reproduce sexually","They undergo meiosis"],"Rapid evolution produces new strains, drives antigenic change in flu and allows HIV to evade the immune system and drugs.");
M("A2.3","The similar structural features shared by different viruses are best explained by:","Convergent evolution due to a shared obligate parasitic lifestyle, with viruses arising several times",["Descent from a single ancestral virus","Descent from LUCA only","Horizontal gene transfer from eukaryotes only"],"Evidence suggests several independent origins from other organisms.");

/* A3.1 Diversity of organisms */
F("A3.1","In the binomial naming system, the first part of the scientific name is the _____.",["genus"],"Binomial = genus (capitalised) + species (lower case), both italicised.");
M("A3.1","Which shows the correct binomial convention?","Homo sapiens (genus capitalised, species lower case, italicised)",["homo sapiens","Homo Sapiens","HOMO sapiens"],"The genus name starts with a capital letter and the species epithet is entirely lower case.");
M("A3.1","What are the diploid chromosome numbers of humans and chimpanzees?","Humans 46, chimpanzees 48",["Both 46","Humans 48, chimpanzees 46","Humans 23, chimpanzees 24"],"Chimpanzees have 48. The difference is explained by the fusion of two ancestral ape chromosomes to form human chromosome 2.");
M("A3.1","Which evidence supports the hypothesis that human chromosome 2 arose from the fusion of two ancestral ape chromosomes?","Its banding pattern matches two separate chimpanzee chromosomes, and it has a second (vestigial) centromere and telomere sequences in the middle",["Humans have more telomeres at chromosome ends","Chimpanzee chromosome 2 has no banding","The human Y chromosome matches chromosome 2"],"Banding comparison plus the inactive centromere and internal telomere-like sequences point to an end-to-end fusion.");
M("A3.1","In a karyogram, chromosomes are classified using:","Length, centromere position and banding pattern",["Gene function","Number of alleles","The colour of the stain only"],"Cells are arrested at metaphase, photographed, and the chromosomes paired and ordered by size and features.");
M("A3.1","Which statement about genomes is correct?","Individuals within a species differ by relatively few variations, while variation between species is much larger",["Individuals of a species have identical genomes","Variation within a species is greater than between species","All eukaryotes have the same genome size"],"Within-species variation includes SNPs and alleles. Eukaryote genomes differ widely in size and gene content.");
M("A3.1","Which is a current use of whole-genome sequencing?","Investigating evolutionary relationships between species",["Counting chromosomes under a microscope","Producing proteins in cell-free systems","Predicting every embryo’s exact phenotype"],"Sequencing is faster and cheaper now. Personalised medicine is a potential future use.");
M("A3.1","Why is the biological species concept hard to apply to bacteria? (HL)","They reproduce asexually and can exchange genes by horizontal gene transfer",["They contain no DNA","They always interbreed to produce fertile offspring","They show no variation"],"The concept relies on interbreeding and fertile offspring, so it also fails for asexual species and fossils.");
M("A3.1","Environmental DNA (eDNA) barcoding can be used to: (HL)","Identify which species are present in a habitat from DNA in soil or water samples",["Date fossils","Sequence one organism’s whole genome only","Create dichotomous keys automatically"],"DNA shed by organisms is amplified and sequenced, then matched against barcode databases.");
F("A3.1","A tool for identifying organisms by answering a series of paired choices is called a _____ key.",["dichotomous"],"Dichotomous keys use pairs of contrasting statements and can be developed for local species.");

/* A3.2 Classification and cladistics (HL) */
F("A3.2","A group consisting of a common ancestor and ALL of its descendants is called a _____.",["clade","monophyletic group","monophyletic"],"Clades (monophyletic groups) are the basis of natural classification.");
M("A3.2","Why is the traditional hierarchy of taxa sometimes problematic?","It does not always match patterns of divergence generated by evolution",["It is based entirely on DNA sequences","It has too few levels","Taxa cannot be named in Latin"],"Many traditional groupings are not clades, so classification is revised as molecular data accumulate.");
M("A3.2","What is the advantage of classifying organisms according to evolutionary relationships?","Members of a taxon share a common ancestor, so characteristics can be predicted across the group",["It makes all species look similar","It removes the need for DNA data","It gives every genus the same number of species"],"For example, a drug found in one species may be present in its close relatives.");
M("A3.2","The molecular clock estimates divergence times using:","The number of base or amino acid differences, assuming a roughly steady rate of accumulation",["Body size differences","Chromosome number","The age of the oldest fossil only"],"Results are estimates because mutation rates vary with generation time, population size and selection pressure.");
F("A3.2","The base of a cladogram, representing the common ancestor of all the taxa shown, is called the _____.",["root"],"Nodes are hypothetical common ancestors, terminal branches are the taxa being compared, and the root is the oldest ancestor.");
M("A3.2","On a cladogram, species W and X share a node that species Y does not. What can be concluded?","W and X are more closely related to each other than either is to Y",["Y is the ancestor of W and X","W and X are the same species","Y evolved from W"],"Shared recent common ancestry, shown by a more recent node, indicates closer relationship.");
M("A3.2","Which three domains are recognised using rRNA base sequence evidence?","Bacteria, Archaea and Eukarya",["Prokaryota, Eukaryota and Viruses","Plants, Animals and Fungi","Bacteria, Protista and Eukarya"],"Woese’s rRNA comparisons showed Archaea are as distinct from Bacteria as they are from Eukarya.");
M("A3.2","After DNA analysis, many genera of the figwort family (Scrophulariaceae) were moved to other families. What does this illustrate?","Classification is revised when cladistic analysis shows groups do not match evolutionary relationships",["Plants cannot be classified","DNA sequences are less reliable than structure","Species names never change"],"Classification is a hypothesis that changes with new evidence.");
M("A3.2","What does a terminal branch (tip) of a cladogram represent?","A species or taxon being compared",["A hypothetical common ancestor","The point where two lineages split","The most ancient ancestor"],"Terminal branches are the taxa studied. Nodes between them are hypothetical common ancestors.");

/* A4.1 Evolution and speciation */
F("A4.1","Evolution is a change in the _____ characteristics of a population over generations.",["heritable","inherited"],"Only heritable (genetic) changes can be passed on and so contribute to evolution.");
M("A4.1","Pentadactyl limbs in humans, bats, whales and horses are evidence for evolution because they are:","Homologous structures with the same basic bone plan inherited from a common ancestor",["Analogous structures that evolved independently for the same function","Identical in function in every species","Produced by convergent evolution"],"Homologous structures have a similar origin but may have different functions, showing divergent evolution.");
M("A4.1","The wings of birds and insects are examples of:","Analogous structures resulting from convergent evolution",["Homologous structures","Vestigial structures","Adaptive radiation"],"Same function, different evolutionary origins, because similar selection pressures acted on unrelated lineages.");
M("A4.1","Selective breeding of wild mustard (Brassica oleracea) gave cabbage, broccoli and kale. Why is this evidence for evolution?","It shows heritable variation within a species can be changed by selection over generations",["It shows new species form in a single generation","It shows acquired characteristics are inherited","It shows mutations are never random"],"Artificial selection demonstrates that selection acting on heritable variation changes populations.");
M("A4.1","Which molecular evidence supports evolution?","Closely related species show fewer differences in DNA and protein sequences",["All species have identical DNA","Distantly related species have fewer differences","Protein sequences never change"],"Sequence differences accumulate over time, so they match the relationships suggested by other evidence.");
M("A4.1","Bonobos and common chimpanzees are separated by the Congo River. This illustrates:","Geographic isolation leading to reproductive isolation and differential selection",["Sympatric speciation","Polyploidy","Artificial selection"],"Separated populations with no gene flow experience different selection pressures and diverge.");
M("A4.1","Which statement correctly distinguishes sympatric from allopatric speciation? (HL)","Sympatric speciation occurs in the same area without a geographic barrier; allopatric requires geographic separation",["Sympatric requires a geographic barrier; allopatric does not","Sympatric happens only in plants; allopatric only in animals","Both require polyploidy"],"Reproductive isolation in sympatric speciation can be behavioural, temporal or genetic (for example polyploidy).");
M("A4.1","Adaptive radiation is best described as: (HL)","Rapid diversification of an ancestral species into many species adapted to different niches",["Convergence of unrelated species to a similar form","Hybridisation of two species to form one","Loss of biodiversity after mass extinction"],"Examples: Darwin’s finches and Hawaiian honeycreepers, which radiated into available niches.");
M("A4.1","Which is a pre-zygotic barrier to hybridization? (HL)","Different courtship behaviour or flowering times",["Sterility of hybrid offspring","Hybrid inviability after fertilization","Low fitness of hybrid offspring"],"Pre-zygotic barriers prevent mating or fertilization. Hybrid sterility (e.g. mules) is post-zygotic. Both prevent mixing of alleles between species.");
M("A4.1","Many species of knotweed (Persicaria) formed abruptly through: (HL)","Hybridization followed by polyploidy",["Gradual geographic isolation","Genetic drift only","Artificial selection"],"Hybrids that double their chromosome set become fertile and reproductively isolated from both parents in one step.");

/* A4.2 Conservation of biodiversity */
M("A4.2","Which defines genetic diversity?","The variety of alleles within a species or population",["The number of species in an ecosystem","The variety of ecosystems in a region","The number of individuals in a population"],"Genetic diversity gives populations the raw material to adapt to change.");
F("A4.2","The variety of habitats, communities and ecological processes in a region is called _____ diversity.",["ecosystem"],"The three levels of biodiversity are ecosystem, species and genetic diversity.");
M("A4.2","The current (sixth) mass extinction is mainly caused by:","Human activities such as habitat loss, overexploitation, pollution and invasive species",["An asteroid impact","Massive volcanic eruptions","Ice ages"],"Earlier mass extinctions had natural causes. The present rate of loss is largely anthropogenic.");
M("A4.2","The extinction of the North Island giant moa is mainly attributed to:","Hunting by humans, along with habitat clearance",["Disease introduced by settlers","Volcanic eruptions","Competition with deer"],"Moas are an example of terrestrial megafauna lost after human arrival.");
M("A4.2","Caribbean monk seals became extinct mainly because of:","Overexploitation by hunting and loss of breeding sites",["Ocean acidification","Competition from other seals","Introduced predators on breeding beaches"],"They are an example of the loss of a marine species through hunting.");
M("A4.2","Loss of mixed dipterocarp forest in Southeast Asia is mainly due to:","Logging and conversion of land to plantations and agriculture",["Natural succession","Glaciation","Cyclical flooding"],"Deforestation destroys habitat for many species and releases carbon.");
M("A4.2","Which is regarded as the main overarching cause of the current biodiversity crisis?","Human population growth and rising resource use",["Natural climate cycles","A decreased rate of speciation","Increased predation by carnivores"],"Specific causes include hunting, urbanisation, deforestation, agriculture, pollution and invasive alien species.");
M("A4.2","Rewilding aims to:","Restore ecosystems to a more natural state, often by reintroducing species and reducing human management",["Store seeds in cold vaults","Breed endangered animals in zoos","Move species to new continents for farming"],"Rewilding is an in situ approach, for example reintroducing predators to restore ecosystem processes.");
M("A4.2","EDGE species are prioritised for conservation because they are:","Evolutionarily distinct and globally endangered, so their loss would erase unique evolutionary history",["Common species that support ecosystems","Species with the largest populations","Invasive species"],"EDGE of Existence targets species with few close relatives and a high extinction risk.");
F("A4.2","Seeds stored in seed banks and tissues stored in tissue banks are examples of storing _____ plasm.",["germ"],"Germ plasm storage is an ex situ approach alongside zoos and botanic gardens. No single approach is sufficient.");

/* ---- Unit B part 1 ---- */
/* B1.1 Carbohydrates and lipids */
F("B1.1","A carbon atom can form _____ covalent bonds, allowing a huge diversity of carbon compounds.",["four","4"],"Carbon’s four bonds allow chains (branched or unbranched), rings and combinations.");
M("B1.1","Which reaction joins monomers to form polymers?","Condensation, which releases water",["Hydrolysis, which releases water","Hydrolysis, which uses water","Oxidation, which releases carbon dioxide"],"Condensation forms covalent bonds (e.g. glycosidic, peptide, ester) and produces a water molecule each time.");
F("B1.1","The digestion of polymers into monomers is carried out by _____ reactions.",["hydrolysis"],"Hydrolysis uses water to break the covalent bonds between monomers.");
M("B1.1","Which properties make glucose well suited as a transport and respiratory fuel?","It is soluble, transportable, chemically stable and yields energy when oxidized",["It is hydrophobic and can be stored in membranes","It is insoluble so it forms granules in blood","It is so reactive that it bonds spontaneously to proteins"],"Glucose dissolves in blood plasma, is stable enough to transport, and releases energy in cell respiration.");
M("B1.1","Why is starch well suited to energy storage in plants?","It is compact, insoluble, and α-glucose units can easily be added or removed by condensation and hydrolysis",["It is soluble so it moves quickly between cells","It is made of β-glucose in straight chains","It is the main component of cell walls"],"Insolubility means starch does not change the osmotic balance of cells. Coiling (amylose) and branching (amylopectin) make it compact.");
M("B1.1","Why can animals mobilise glycogen quickly when glucose is needed?","Its highly branched structure has many free ends from which glucose can be removed at the same time",["It is soluble in water so it dissolves into blood","It is made of β-glucose so enzymes act on it faster","It is stored in blood plasma"],"More ends means more sites for hydrolysis. Glycogen is stored mainly in liver and muscle.");
M("B1.1","Why is cellulose a strong structural polysaccharide?","Alternate β-glucose units are inverted, giving straight chains cross-linked by hydrogen bonds into microfibrils",["α-glucose chains coil into compact helices","The chains are highly branched with many free ends","It is stored as granules in chloroplasts"],"Many hydrogen bonds between parallel chains make cellulose fibres very strong, which is ideal for plant cell walls.");
F("B1.1","ABO blood group antigens are examples of cell-surface _____ that function in cell–cell recognition.",["glycoproteins","glycoprotein"],"Carbohydrate chains attached to membrane proteins act as recognition markers.");
M("B1.1","Which describes a saturated fatty acid?","A hydrocarbon chain with no C=C double bonds",["A chain with one C=C double bond","A chain with two or more C=C double bonds","A chain containing a phosphate group"],"Saturated fatty acids pack tightly, so they have higher melting points. Monounsaturated have one double bond and polyunsaturated have two or more.");
M("B1.1","Why do oils (unsaturated) have lower melting points than saturated fats?","Double bonds put kinks in the chains, preventing tight packing",["They have shorter chains","They are bonded to phosphate","They form more hydrogen bonds"],"Loose packing means less energy is needed to separate the molecules, so they stay liquid at room temperature.");
M("B1.1","Why are triglycerides better than carbohydrates for long-term energy storage?","They contain more energy per gram and are hydrophobic, so they can be stored compactly without affecting osmosis",["They are soluble and quickly mobilised","They contain more oxygen so they release energy faster","They are polymers of amino acids"],"Fat also provides thermal insulation and protection in adipose tissue.");
F("B1.1","Molecules with both hydrophilic and hydrophobic regions, such as phospholipids, are described as _____.",["amphipathic","amphiphilic"],"The phosphate head is hydrophilic and the fatty acid tails are hydrophobic, so phospholipids form bilayers in water.");
M("B1.1","Which of these can cross the phospholipid bilayer directly?","Non-polar steroids such as oestradiol and testosterone",["Sodium ions","Glucose","Amino acids"],"Hydrophobic (non-polar) molecules dissolve in the lipid core of the membrane. Ions and polar molecules need transport proteins.");
M("B1.1","A triglyceride is formed from:","One glycerol and three fatty acids joined by ester bonds in condensation reactions",["Three glycerols and one fatty acid","Glycerol, two fatty acids and a phosphate group","Three amino acids joined by peptide bonds"],"Glycerol + two fatty acids + phosphate would be a phospholipid.");

/* B1.2 Proteins */
M("B1.2","Which describes the general structure of an amino acid?","A central carbon bonded to an amine group, a carboxyl group, a hydrogen atom and an R group",["A central carbon bonded to a phosphate, a hydroxyl, a hydrogen and a base","A central nitrogen bonded to two carboxyl groups","A central carbon bonded to four R groups"],"The R group is what differs between the 20 amino acids.");
F("B1.2","Amino acids are joined in a polypeptide by _____ bonds.",["peptide"],"A peptide bond forms between the carboxyl group of one amino acid and the amine group of the next, in a condensation reaction.");
M("B1.2","How many different amino acids are specified by the genetic code?","20",["4","10","64"],"There are 64 codons but they specify 20 amino acids, so the genetic code is degenerate.");
M("B1.2","Why is the number of possible polypeptides effectively limitless?","Chains can have any number of amino acids, arranged in any order",["Only four amino acids exist so combinations are few","Each polypeptide must contain exactly 20 amino acids","The order of amino acids is fixed by the cell wall"],"With 20 amino acids and chains up to thousands long, the number of possible sequences is enormous.");
M("B1.2","What is meant by an essential amino acid?","One that cannot be made by the body and must be obtained from the diet",["One that is found in every protein","One made in the liver from lipids","One found only in plant foods"],"Essential amino acids differ between species, and a balanced diet must supply them.");
M("B1.2","What is the primary structure of a protein?","The sequence of amino acids in a polypeptide",["The α-helix and β-pleated sheet folding","The three-dimensional shape of one polypeptide","The joining of several polypeptides"],"The primary structure determines all higher levels of structure, so proteins have precise, repeatable shapes.");
M("B1.2","Alpha helices and beta-pleated sheets (secondary structure) are stabilised by:","Hydrogen bonds between backbone atoms at regular intervals",["Disulfide bridges between cysteines","Ionic bonds between R groups","Peptide bonds between R groups"],"Secondary structure involves regular coiling or pleating of the backbone.");
M("B1.2","Which interactions stabilise tertiary structure?","Hydrogen bonds, ionic bonds, disulfide bridges and hydrophobic interactions between R groups",["Only peptide bonds","Only hydrogen bonds between backbone atoms","Phosphodiester bonds between R groups"],"Tertiary structure is the overall 3D shape of a single polypeptide.");
F("B1.2","A covalent bond between the R groups of two cysteine residues is called a _____ bridge.",["disulfide","disulphide"],"Disulfide bridges are strong covalent cross-links in tertiary and quaternary structures.");
M("B1.2","In a water-soluble globular protein, non-polar (hydrophobic) amino acids are usually found:","In the interior, away from water",["On the outside surface","Only at the N terminus","Only in the active site"],"Hydrophilic R groups are on the surface, so the protein is soluble. In membrane proteins the pattern is reversed in the part within the bilayer.");
M("B1.2","Which statement about haemoglobin is correct?","It is a conjugated protein with quaternary structure: four polypeptides, each with a haem group",["It is a fibrous protein made of one polypeptide","It is a non-conjugated protein with only tertiary structure","It is a hormone secreted by the pancreas"],"Conjugated proteins contain a non-protein part (haem, containing iron).");
M("B1.2","How is collagen’s structure related to its function?","Three polypeptides wind into a rope-like triple helix, giving great tensile strength",["It is a soluble globular protein carried in blood","It has a haem group for oxygen","It is a single α-helix"],"Collagen is a fibrous protein found in skin, tendons and bone.");
M("B1.2","Insulin is an example of a protein that is:","Globular and soluble, with two polypeptide chains joined by disulfide bridges",["Fibrous and insoluble","A single unbranched polypeptide with no tertiary structure","A conjugated protein containing iron"],"Its solubility lets it be transported in blood to target cells.");
M("B1.2","What is the effect of high temperature or extreme pH on a protein?","Denaturation: bonds maintaining the 3D shape break, so function is lost",["Peptide bonds are repaired","The primary structure is rearranged","Amino acids are converted into others"],"Denaturation usually disrupts hydrogen and ionic bonds etc. but not the peptide bonds, so the primary structure remains.");
M("B1.2","Which R-group property makes an amino acid hydrophilic?","It is polar or charged (acidic or basic)",["It has a long hydrocarbon chain","It is non-polar","It is attached to the carboxyl group"],"Charged R groups can form ionic bonds, and polar ones form hydrogen bonds with water.");

/* B2.1 Membranes and membrane transport */
M("B2.1","Why do phospholipids spontaneously form bilayers in water?","Hydrophilic heads face the water, while hydrophobic tails are shielded in the interior",["Hydrophobic heads face the water","All parts of the phospholipid are attracted to water","Hydrogen bonds form between the fatty acid tails"],"The bilayer is stabilised by the hydrophobic effect and hydrophilic interactions.");
F("B2.1","Oxygen and carbon dioxide cross membranes by simple _____.",["diffusion"],"Small non-polar molecules pass through the phospholipid bilayer down their concentration gradients.");
M("B2.1","Which particles cross a phospholipid bilayer least easily?","Ions and large polar molecules",["Oxygen","Carbon dioxide","Non-polar steroids"],"The hydrophobic core resists hydrophilic and large particles, so they require transport proteins.");
M("B2.1","Which membrane proteins span the bilayer and have hydrophobic regions in contact with the fatty acid tails?","Integral proteins",["Peripheral proteins","Glycolipids","Cholesterol"],"Peripheral proteins attach to the surface and have hydrophilic surfaces.");
F("B2.1","Water channel proteins that speed up osmosis are called _____.",["aquaporins","aquaporin"],"Osmosis is the passive movement of water across a selectively permeable membrane toward higher solute concentration.");
M("B2.1","How does facilitated diffusion differ from simple diffusion?","It uses channel or carrier proteins but needs no ATP, moving substances down a concentration gradient",["It moves substances against a gradient using ATP","It requires vesicles","It occurs only in plant cells"],"Channels are specific, and open and close, so membranes are selectively permeable.");
M("B2.1","Active transport by pump proteins:","Moves substances against their concentration gradient using energy from ATP",["Moves substances down a gradient without energy","Uses energy from sunlight","Needs no protein"],"Pumps change shape as they move specific particles across.");
M("B2.1","What determines selectivity in membrane permeability?","The size, polarity and charge of particles and the presence of specific transport proteins",["The colour of the particle","Whether the particle contains DNA","The age of the cell"],"Selectivity allows cells to control their internal composition.");
M("B2.1","Glycoproteins and glycolipids on the extracellular surface are involved in:","Cell adhesion and cell recognition",["Producing ATP","Synthesising DNA","Storing lipids"],"The carbohydrate chains face outwards, forming the glycocalyx.");
M("B2.1","In the fluid mosaic model, ‘fluid’ refers to the fact that:","Phospholipids and many proteins can move laterally within the layer",["Membranes are made of water","Membranes flow out of the cell","Proteins form a continuous solid layer"],"‘Mosaic’ refers to the scattered pattern of proteins in the bilayer.");
M("B2.1","How does cholesterol affect membrane fluidity in animal cells? (HL)","It moderates fluidity: reduces it at high temperatures and prevents stiffening at low temperatures",["It always increases fluidity","It always decreases fluidity","It has no effect on fluidity"],"Cholesterol sits between phospholipids and stabilises the membrane.");
M("B2.1","Compared with saturated fatty acids, unsaturated fatty acids in membrane phospholipids make the membrane:","More fluid, because kinks prevent tight packing",["Less fluid","Rigid at low temperatures","Impermeable to water"],"Organisms in cold environments tend to have more unsaturated fatty acids in membranes.");
F("B2.1","The bulk movement of material into a cell by vesicles formed from the plasma membrane is called _____.",["endocytosis"],"Exocytosis is the reverse process. Both depend on membrane fluidity.");
M("B2.1","The sodium–potassium pump: (HL)","Moves 3 Na⁺ out and 2 K⁺ in per ATP, helping generate membrane potentials",["Moves 2 Na⁺ out and 3 K⁺ in per ATP","Moves Na⁺ and K⁺ in the same direction","Is a form of facilitated diffusion"],"It is an exchange transporter that maintains the gradients needed for nerve impulses.");
M("B2.1","Sodium-dependent glucose cotransporters are an example of: (HL)","Indirect active transport: sodium moving down its gradient drives glucose uptake against its gradient",["Simple diffusion of glucose","Direct active transport in which the cotransporter hydrolyses ATP","Exocytosis"],"Found in the small intestine and the nephron. The sodium gradient is maintained by the sodium–potassium pump.");
M("B2.1","Cell-adhesion molecules (CAMs) are involved in: (HL)","Holding cells together to form tissues, with different types forming different cell–cell junctions",["Transporting glucose","Making ATP","Breaking down proteins"],"CAMs link cells to one another and to the extracellular matrix.");

/* B2.2 Organelles and compartmentalization */
M("B2.2","Which of these is NOT considered an organelle?","The cell wall",["A ribosome","The nucleus","A vesicle"],"The cell wall, cytoskeleton and cytoplasm are not organelles.");
M("B2.2","What is the main advantage of compartmentalization in the cytoplasm?","Enzymes and substrates can be concentrated and incompatible reactions kept separate",["It allows every reaction to occur anywhere in the cell","It eliminates the need for enzymes","It increases the number of reactions that need ATP"],"Separate compartments can also have their own optimal pH.");
M("B2.2","Lysosomes illustrate compartmentalization because:","Digestive enzymes operate at low pH, separated from the rest of the cell",["They contain DNA","They synthesise proteins","They make ATP"],"The membrane prevents the hydrolytic enzymes from damaging the cell’s own contents.");
M("B2.2","What is the advantage of separating the nucleus from the cytoplasm?","mRNA can be processed before it meets ribosomes in the cytoplasm",["DNA replication can occur in the cytoplasm","Ribosomes can read DNA directly","It prevents mRNA being made"],"Transcription and translation are separated, allowing post-transcriptional modification such as splicing.");
M("B2.2","Which adaptation increases ATP production in a mitochondrion? (HL)","A folded inner membrane (cristae) giving large surface area, and a small intermembrane space for a steep proton gradient",["Many thylakoid stacks","A thick cell wall","Many nuclear pores"],"The matrix holds the Krebs cycle enzymes and substrates, and the inner membrane holds the electron transport chain and ATP synthase.");
F("B2.2","The fluid-filled inner compartment of a chloroplast, where the Calvin cycle occurs, is the _____.",["stroma"],"Thylakoids hold the light-dependent reactions and have a small internal volume for proton accumulation.");
M("B2.2","What do nuclear pores allow? (HL)","mRNA to leave the nucleus and proteins and nucleotides to enter",["DNA to leave the nucleus","Ribosomes to be made in the cytoplasm","ATP to be synthesised"],"The double membrane has pores, and it can break into vesicles during mitosis and meiosis.");
M("B2.2","Where are proteins destined for secretion synthesised? (HL)","On ribosomes attached to the rough endoplasmic reticulum",["On free ribosomes in the cytosol","In the Golgi apparatus","In lysosomes"],"Free ribosomes make proteins for use within the cell, such as cytoplasmic enzymes.");
M("B2.2","What is the role of the Golgi apparatus with respect to proteins? (HL)","It modifies, sorts and packages proteins into vesicles for secretion",["It synthesises polypeptides from mRNA","It produces ATP","It digests worn-out organelles"],"Proteins arrive from the rough ER in vesicles and leave from the opposite face.");
F("B2.2","The protein _____ helps form coated vesicles during endocytosis.",["clathrin"],"Clathrin assembles into a lattice on the cytoplasmic side of the membrane, shaping and pinching off the vesicle.");

/* B2.3 Cell specialization */

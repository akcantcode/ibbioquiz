M("B2.3","Cell differentiation happens because:","Different genes are expressed in different cells, so different proteins are made",["Cells lose the genes they do not use","Cells gain new genes from neighbours","Each cell type has different mutations"],"All cells of an organism have the same genome, and gene expression is controlled by signals and gradients in the embryo.");
M("B2.3","Which property is characteristic of stem cells?","They can divide endlessly and differentiate along different pathways",["They cannot divide","They have a fixed specialised function","They lack a nucleus"],"Stem cells are unspecialised and can self-renew.");
M("B2.3","Which stem cells can form every cell type, including the placenta?","Totipotent",["Pluripotent","Multipotent","Unipotent"],"Early embryo cells are totipotent but soon become pluripotent. Adult stem cells are usually multipotent.");
M("B2.3","Bone marrow stem cells that produce several types of blood cell are:","Multipotent",["Totipotent","Pluripotent","Unipotent"],"Multipotent cells are restricted to a limited range of cell types.");
M("B2.3","What is a stem cell niche?","A microenvironment, such as in bone marrow or hair follicles, that maintains stem cells and regulates their division and differentiation",["A type of mature specialised cell","A structure in the nucleus","A disease caused by stem cell loss"],"Niches provide signals that either maintain stem cells or promote their proliferation and differentiation.");
M("B2.3","Which cell is specialised by being exceptionally long?","A neuron (an axon can be around a metre long)",["A red blood cell","An egg cell","A white blood cell"],"Striated muscle fibres are also very long. Egg cells are among the largest human cells by volume.");
M("B2.3","Which statement about surface area to volume ratio is correct?","Exchange of materials depends on the cell’s surface area, whereas the need for exchange depends on its volume",["Exchange depends on volume and need depends on surface area","Both depend only on cell shape","Neither affects cell size"],"As cells grow, volume increases faster than surface area, which limits cell size.");
M("B2.3","Microvilli, flattening and invagination are adaptations that: (HL)","Increase the cell’s surface area to volume ratio",["Decrease the rate of diffusion","Reduce the need for mitochondria","Prevent cell division"],"Examples: red blood cells (flattened biconcave) and cells of the proximal convoluted tubule (microvilli).");
M("B2.3","Type II pneumocytes are specialised to: (HL)","Secrete surfactant from many vesicles (lamellar bodies), reducing surface tension in the alveoli",["Provide a very thin barrier for gas exchange","Carry oxygen","Produce antibodies"],"Type I pneumocytes are extremely thin to shorten the diffusion distance.");
M("B2.3","Cardiac muscle cells differ from skeletal muscle fibres because cardiac cells: (HL)","Are branched and typically have one nucleus, so they connect to spread contraction",["Are unbranched, very long and multinucleate","Lack myofibrils","Are never connected to neighbouring cells"],"Both contain contractile myofibrils.");
M("B2.3","Which is an adaptation of the human egg cell? (HL)","A large volume of cytoplasm with food reserves, and a layer around it that helps prevent polyspermy",["A long flagellum","A midpiece packed with mitochondria","An acrosome of digestive enzymes"],"Sperm are small and motile with an acrosome, many mitochondria and a flagellum.");

/* ---- Unit B part 2 ---- */
/* B3.1 Gas exchange */
M("B3.1","Why does gas exchange become more challenging as organisms increase in size?","Surface area to volume ratio decreases and diffusion distances increase",["Surface area to volume ratio increases","Cells need less oxygen","Diffusion becomes faster over long distances"],"Large organisms need specialised exchange surfaces and transport systems.");
M("B3.1","Which is NOT a property of an efficient gas exchange surface?","A thick, impermeable layer",["Large surface area","Moist surface","Thin tissue layer"],"Gas exchange surfaces are thin, permeable, moist and have a large surface area.");
M("B3.1","How are concentration gradients maintained at gas exchange surfaces in animals?","By ventilation and continuous blood flow through dense capillary networks",["By closing the surface between breaths","By stopping blood flow to lungs","By keeping air stationary"],"Ventilation brings fresh air (lungs) or water (gills), and blood removes oxygen and supplies carbon dioxide.");
M("B3.1","Which is an adaptation of mammalian alveoli for gas exchange?","Surfactant, extensive capillary beds and a very large total surface area",["A thick wall of connective tissue","Very few capillaries","A dry inner surface"],"Surfactant reduces surface tension and keeps the alveoli from collapsing. Bronchioles form a branching network.");
M("B3.1","What happens during inhalation?","External intercostals and the diaphragm contract, increasing thoracic volume and lowering pressure",["The diaphragm relaxes and domes upward","Internal intercostals contract and lower the ribs","Thoracic pressure rises above atmospheric"],"Air flows in from higher external pressure to the lower pressure in the lungs.");
M("B3.1","What happens during forced exhalation?","Internal intercostals and abdominal muscles contract, decreasing thoracic volume",["External intercostals contract","The diaphragm flattens","The ribs move up and out"],"Normal exhalation is passive, relying on elastic recoil and relaxation of the muscles.");
F("B3.1","The volume of air breathed in or out in a normal breath is the _____ volume.",["tidal"],"Spirometry measures tidal volume, vital capacity and the reserve volumes.");
M("B3.1","Vital capacity is:","The maximum volume of air that can be exhaled after a maximal inhalation",["The air remaining after maximal exhalation","The volume of a normal breath","The volume that can be inhaled in addition to a normal breath only"],"Residual volume cannot be exhaled and is not part of vital capacity.");
M("B3.1","Which leaf tissue has the most chloroplasts and is the main site of photosynthesis?","Palisade mesophyll",["Spongy mesophyll","Upper epidermis","Xylem"],"Spongy mesophyll has air spaces for gas diffusion.");
M("B3.1","When do guard cells open a stoma?","When they absorb water and become turgid",["When they lose water and become flaccid","When the leaf cools to freezing","When xylem pressure drops to zero"],"Open stomata allow CO₂ in but also let water vapour out by transpiration.");
M("B3.1","Which factor increases the rate of transpiration?","Higher temperature, lower humidity, increased wind speed",["Higher humidity","Lower temperature","Closed stomata"],"Transpiration is the unavoidable loss of water vapour through open stomata during gas exchange.");
M("B3.1","Compared with adult haemoglobin, fetal haemoglobin has: (HL)","A higher affinity for oxygen, so oxygen transfers from mother to fetus",["A lower affinity for oxygen","The same affinity for oxygen","No haem groups"],"The fetal curve lies to the left of the adult curve, so it saturates at lower oxygen partial pressures.");
M("B3.1","The Bohr shift is: (HL)","A decrease in haemoglobin’s oxygen affinity at higher CO₂ (lower pH), so more oxygen is released in active tissues",["An increase in affinity at high CO₂","A shift of the curve to the left when CO₂ rises","A decrease in CO₂ binding in the lungs"],"The curve shifts right when CO₂ is high, which helps deliver oxygen to respiring tissues.");
M("B3.1","The S-shaped (sigmoid) oxygen dissociation curve results from: (HL)","Cooperative binding: binding of one O₂ makes it easier for the next to bind",["Each haem group binding independently","Oxygen binding to the globin chains only","Carbon dioxide binding at the haem group"],"Binding changes haemoglobin’s conformation, increasing the affinity of the remaining haem groups.");

/* B3.2 Transport */
M("B3.2","How are capillaries adapted for exchange of materials?","Walls one cell thick with pores or gaps, and a narrow lumen",["Thick muscular walls","Valves along the length","A wide lumen and no pores"],"Narrow capillaries slow blood and bring it close to cells.");
M("B3.2","How are arteries adapted to withstand and maintain high blood pressure?","Thick walls with layers of muscle and elastic fibres, and a narrow lumen",["Thin walls with valves","A wide lumen with no muscle","Walls one cell thick"],"Elastic recoil smooths the pulsing flow.");
M("B3.2","How are veins adapted to return blood to the heart?","Valves prevent backflow, and flexible walls can be compressed by surrounding muscles",["Thick elastic walls to maintain high pressure","No valves and a narrow lumen","Walls one cell thick"],"Blood is at low pressure in veins, so muscle contraction helps move it.");
F("B3.2","Valves in veins prevent _____ of blood.",["backflow","back flow"],"Skeletal muscle contraction squeezes veins and the valves ensure one-way flow.");
M("B3.2","Occlusion of a coronary artery leads to:","Reduced blood supply to heart muscle, which can cause a heart attack",["Increased oxygen supply to the heart","Higher resting pulse in the lungs only","Collapse of the alveoli"],"Causes include cholesterol-rich plaque, high blood pressure and smoking. Epidemiological data link them to coronary heart disease.");
M("B3.2","What pulls water up through xylem from roots to leaves?","Tension from transpiration, with water molecules held together by cohesion",["Root pressure only","Active transport by xylem cells","Pressure from companion cells"],"Evaporation from leaf cell walls creates tension (negative pressure) that draws up a continuous water column.");
M("B3.2","How are xylem vessels adapted for water transport?","Lignified walls withstand tension, with no cell contents or end walls for unimpeded flow, and pits for water exit and entry",["Sieve plates between cells","Living cytoplasm with many mitochondria","Thin cellulose walls only"],"Lignin prevents the vessels from collapsing under negative pressure.");
M("B3.2","In a transverse section of a dicot root, the xylem is typically found:","In the centre, often in an X or star shape, with phloem between its arms",["In a ring near the epidermis","Scattered throughout the cortex","In the outer layer of the root cap"],"In dicot stems the vascular bundles form a ring near the outside.");
M("B3.2","How are root hair cells adapted for absorption?","A long extension increases surface area, and mitochondria provide ATP for mineral ion uptake by active transport",["A thick cuticle to reduce water uptake","Chloroplasts to produce sugars","No cell wall"],"Roots take up water by osmosis and mineral ions by active transport.");
M("B3.2","How is tissue fluid formed? (HL)","Hydrostatic pressure at the arterial end of a capillary forces plasma out through gaps",["Red blood cells leave the capillary","Lymph flows into the capillary","Osmosis only draws water in"],"Tissue fluid contains most plasma components except large proteins and carries nutrients and oxygen to cells.");
M("B3.2","How is excess tissue fluid returned to the circulation? (HL)","Via lymph vessels, which have valves and drain into veins near the heart",["Through the arteries","By flowing directly into the xylem","Through the alveoli"],"Lymph ducts have thin walls with gaps and valves, and lymph is returned to blood.");
M("B3.2","What is the advantage of double circulation in mammals compared with the single circulation of fish? (HL)","Blood is returned to the heart and re-pressurised after the lungs, so tissues receive blood at higher pressure",["Blood passes through the heart only once per circuit","Blood bypasses the lungs","Pressure is lost at the gills"],"In fish, pressure falls after the gills, so flow to the body is slower.");
F("B3.2","The group of cardiac cells that initiates each heartbeat is the _____.",["pacemaker","sinoatrial node","sa node","sino-atrial node"],"The pacemaker (SA node) in the right atrium sends impulses that make the atria contract, followed by the ventricles.");
M("B3.2","How is root pressure generated in xylem? (HL)","Active transport of mineral ions into xylem lowers its water potential, so water enters by osmosis",["Evaporation from leaves","Contraction of xylem cells","Pressure from phloem companion cells"],"Root pressure is a push from below, as opposed to the pull from transpiration.");
M("B3.2","How are phloem sieve tubes adapted for translocation? (HL)","Sieve plates, reduced cytoplasm, no nucleus, and companion cells with many mitochondria",["Thick lignified walls and no cell contents","Pits only for water entry","Chloroplasts in each sieve element"],"Companion cells provide ATP and support the metabolism of the sieve tube element.");

/* B3.3 Muscle and motility (HL) */
M("B3.3","Which describes the sliding filament model?","Myosin heads pull actin filaments toward the centre of the sarcomere, so it shortens while the filaments keep their length",["Actin and myosin filaments shorten during contraction","Myosin filaments slide past each other","Actin filaments are destroyed during contraction"],"Cross-bridges form between myosin heads and actin using ATP.");
M("B3.3","During contraction of a sarcomere, which region stays the same length?","The A band",["The I band","The H zone","The whole sarcomere"],"The I band and H zone shorten as filaments overlap more.");
F("B3.3","The repeating contractile unit of a muscle fibre is the _____.",["sarcomere"],"Many sarcomeres in series make up a myofibril.");
M("B3.3","What is the role of titin in muscle?","It is elastic, helping muscle relax and return to its resting length, and stores energy when stretched",["It binds calcium","It is the thick filament","It transmits nerve impulses"],"When one muscle contracts, it stretches its antagonist, storing potential energy in titin.");
M("B3.3","Why are antagonistic muscle pairs needed?","Muscles can only pull by contracting, so another muscle is needed to reverse the movement",["Muscles can push as well as pull","Each muscle can both lengthen and shorten actively","Bones cannot move without joints"],"Examples: biceps and triceps, internal and external intercostal muscles.");
M("B3.3","What is a motor unit?","A motor neuron and all the muscle fibres it stimulates",["A single muscle fibre and its capillary","A sensory neuron and an effector","A bundle of nerves"],"Fine control uses small motor units, and recruiting more units increases force.");
M("B3.3","What happens at a neuromuscular junction?","Acetylcholine released by the motor neuron binds receptors on the muscle fibre and triggers depolarization",["The muscle releases acetylcholine to the neuron","Calcium binds to titin","The neuron releases ATP"],"This starts the sequence that leads to contraction of the muscle fibres.");
M("B3.3","In a synovial joint such as the hip, which structure joins bone to bone?","Ligaments",["Tendons","Cartilage","Synovial fluid"],"Tendons join muscle to bone. Cartilage reduces friction and synovial fluid lubricates the joint.");
F("B3.3","Tendons attach _____ to bone.",["muscle","muscles"],"Tendons transmit the force of muscle contraction to the skeleton, which acts as a lever and as an anchorage.");
M("B3.3","Which adaptation helps marine mammals swim efficiently?","Streamlined body, flippers, a tail fluke that moves up and down, and airways allowing periodic breathing between dives",["Gills for gas exchange","Hind legs with webbed feet only","A thick exoskeleton"],"These adaptations reduce drag and allow long dives.");
M("B3.3","Which list gives reasons for locomotion?","Foraging for food, escaping danger, searching for a mate and migration",["Photosynthesis, excretion and digestion","Growth, mutation and ageing","Respiration, diffusion and osmosis"],"Locomotion is an adaptation for movement, a universal feature of living organisms (motile versus sessile species).");

/* B4.1 Adaptation to environment */
F("B4.1","The place in which an organism, population or community lives is its _____.",["habitat"],"A habitat description may include geographic location, physical conditions and ecosystem type.");
M("B4.1","Marram grass is adapted to sand dunes. Which features does it have?","Rolled leaves with sunken stomata and extensive roots, reducing water loss",["Large flat leaves with many stomata","Aerial roots for gas exchange","A succulent stem storing water"],"Dunes are dry, windy and nutrient-poor.");
M("B4.1","How are mangrove trees adapted to salty, waterlogged mud?","Aerial roots (pneumatophores) for gas exchange and mechanisms to excrete or exclude salt",["Deep taproots to find fresh groundwater","Thick succulent leaves storing water","Rolled leaves with sunken stomata"],"Mud has little oxygen and high salinity, so prop roots also give support.");
F("B4.1","The range of environmental conditions in which a species can survive is its range of _____.",["tolerance"],"Adaptations determine a species’ tolerance limits, which in turn affect its distribution.");
M("B4.1","Which of these is an abiotic factor affecting species distribution?","Soil pH",["Predation","Parasitism","Competition"],"Other abiotic factors: temperature, light intensity, water availability and salinity.");
M("B4.1","What is a belt transect used for?","To show how species distribution changes along an environmental gradient",["To estimate population size of mobile animals by marking","To measure respiration rate","To count chromosomes"],"Transect data are correlated with abiotic variables measured with sensors or probes.");
M("B4.1","Which conditions are needed for coral reef formation?","Warm, shallow, clear, saline water at suitable pH",["Cold, deep water","Fresh water","Turbid water"],"Reef-building corals depend on light for their symbiotic algae (zooxanthellae) and on a suitable pH for calcification.");
M("B4.1","What mainly determines the distribution of terrestrial biomes?","Temperature and rainfall",["Soil colour","Altitude only","Human activity"],"For any given climate, a particular biome tends to develop.");
M("B4.1","Why do similar biomes in different parts of the world have similar communities?","Convergent evolution under similar abiotic conditions",["They share the same species","Common ancestry only","Continental drift"],"Biomes are groups of ecosystems with similar communities due to similar abiotic conditions and convergent evolution.");
M("B4.1","Which adaptation helps hot desert animals conserve water?","Concentrated urine, nocturnal activity and burrowing",["Thin permeable skin","Many sweat glands","A thick layer of blubber"],"Example: the kangaroo rat. Many desert plants have water-storing tissue, spines and reduced leaves.");
M("B4.1","Which adaptation is typical of tropical rainforest plants?","Drip tips on leaves, buttress roots and epiphytic growth to reach light",["Succulent stems storing water","Leaves reduced to spines","Rolled leaves with sunken stomata"],"Rainforests are hot and wet, so there is intense competition for light.");

/* B4.2 Ecological niches */
M("B4.2","What is an ecological niche?","The role of a species in an ecosystem, including its interactions and how it obtains food",["The physical location where it lives","The size of its population","The predators that eat it"],"A habitat is where a species lives, and its niche is what it does there.");
M("B4.2","Obligate anaerobes:","Cannot tolerate oxygen",["Require oxygen","Can respire with or without oxygen","Can photosynthesise in the presence of oxygen only"],"Facultative anaerobes can use either aerobic or anaerobic respiration, and obligate aerobes need oxygen.");
M("B4.2","Which describes a facultative anaerobe?","It respires aerobically when oxygen is present and anaerobically when it is absent",["It dies in the presence of oxygen","It requires oxygen at all times","It can only photosynthesise"],"Examples: yeast and many gut bacteria.");
F("B4.2","Animals ingest, digest internally, absorb and assimilate their food. This type of nutrition is called _____ nutrition.",["holozoic"],"All animals are heterotrophs.");
M("B4.2","Euglena is described as mixotrophic because:","It can photosynthesise when light is available and also feed heterotrophically",["It lives in both fresh and salt water","It is both a plant and an animal","It uses chemosynthesis only"],"Mixotrophs combine autotrophic and heterotrophic nutrition.");
F("B4.2","Fungi and bacteria that feed on dead organic matter are described as _____.",["saprotrophs","saprotroph","decomposers","saprophytes"],"Saprotrophs secrete digestive enzymes and absorb the products, recycling nutrients.");
M("B4.2","Archaea obtain energy for ATP production from:","Light, oxidation of inorganic chemicals or oxidation of carbon compounds",["Photosynthesis in chloroplasts only","Ingestion of food only","Only from sugars"],"Archaea are metabolically very diverse.");
M("B4.2","Which dentition fits a herbivorous hominid such as Paranthropus robustus?","Large, flat molars and premolars for grinding tough plant material",["Sharp canines for tearing meat","No teeth","Long tusks"],"Teeth show diet: carnivores have pointed teeth. Omnivores such as humans have a mixture.");
M("B4.2","Which is an adaptation of prey animals for resisting predation?","Camouflage, warning colouration or chemical defences",["Forward-facing eyes for depth perception","Sharp claws and fangs","Keen sense of smell for locating food"],"Predators are adapted for finding, catching and killing prey. Prey have physical, chemical and behavioural defences.");
M("B4.2","How do plants resist herbivory?","Thorns, toxic secondary compounds and tough tissues",["Growing faster than they are eaten only","Flowering at night","Releasing oxygen"],"Herbivores in turn have adaptations for feeding on plants.");
M("B4.2","How do lianas harvest light in a forest?","They climb other plants to reach the canopy without building thick trunks",["They grow on the forest floor in deep shade","They live on branches and take nutrients from the air","They have large trunks and compete for canopy height"],"Epiphytes grow on branches, strangler epiphytes eventually surround host trees, and shade-tolerant plants grow on the forest floor.");
M("B4.2","Fundamental niche versus realised niche:","The fundamental niche is the potential niche based on tolerance and adaptations. The realised niche is the actual niche when competitors are present",["The fundamental niche is the actual niche under competition and the realised niche is the potential niche","They are the same thing","The realised niche is always larger than the fundamental niche"],"Competition typically restricts a species to part of its fundamental niche.");
M("B4.2","The competitive exclusion principle states that:","Two species with identical niches cannot coexist indefinitely: one is eliminated or the niches diverge",["Competing species always coexist","Competition always benefits both species","Predators exclude competitors"],"Outcomes include elimination of one species or restriction of both to part of their fundamental niche.");

/* ---- Unit C part 1 ---- */
/* C1.1 Enzymes and metabolism */
M("C1.1","How do enzymes speed up reactions?","By lowering the activation energy",["By raising the temperature of the cell","By increasing the energy of the substrate molecules","By changing the equilibrium position of the reaction"],"Enzymes provide an alternative pathway with lower activation energy, so more collisions result in reaction.");
F("C1.1","The region of an enzyme where the substrate binds and the reaction is catalysed is the _____ site.",["active"],"Only a few amino acids form the active site, but the whole 3D structure gives it the right properties.");
M("C1.1","What does the induced-fit model propose?","The active site changes shape slightly as the substrate binds, improving the fit",["The substrate fits a rigid active site exactly","The enzyme is used up in the reaction","The substrate changes shape before binding"],"Induced fit explains how binding stresses the substrate’s bonds and lowers activation energy.");
M("C1.1","Which is an anabolic reaction?","Synthesis of glycogen from glucose",["Digestion of starch to maltose","Cell respiration of glucose","Hydrolysis of proteins to amino acids"],"Anabolic reactions build macromolecules from monomers (protein synthesis, glycogen formation, photosynthesis). Catabolic reactions break them down.");
M("C1.1","What happens to enzyme activity as temperature rises from low values to the optimum, then beyond?","It increases as collisions become more frequent, then falls sharply as the enzyme denatures",["It increases steadily at all temperatures","It stays constant","It falls to zero immediately below the optimum"],"Higher kinetic energy means more substrate–active site collisions until bonds holding the enzyme’s shape break.");
M("C1.1","How does increasing substrate concentration affect the rate of an enzyme-catalysed reaction (with fixed enzyme concentration)?","The rate rises, then levels off when all active sites are occupied",["The rate rises without limit","The rate falls","There is no effect"],"At saturation, enzyme concentration (or another factor) becomes limiting.");
M("C1.1","Why does an enzyme have an optimum pH?","pH changes alter the charges on R groups, affecting the shape of the active site and substrate binding",["pH changes the sequence of amino acids","Extreme pH increases kinetic energy","pH changes the activation energy of all reactions equally"],"Extremes of pH can denature the enzyme.");
M("C1.1","Competitive inhibitors: (HL)","Resemble the substrate and bind to the active site, and their effect is reduced by raising substrate concentration",["Bind to an allosteric site","Bind to the active site irreversibly only","Increase the reaction rate"],"They compete with the substrate for the active site.");
M("C1.1","Non-competitive inhibitors: (HL)","Bind to an allosteric site, changing the shape of the active site, so extra substrate does not overcome the effect",["Bind to the active site and are displaced by more substrate","Increase the substrate concentration","Always act irreversibly"],"Binding at the allosteric site changes the conformation of the enzyme.");
M("C1.1","Statins lower blood cholesterol because they: (HL)","Competitively inhibit HMG-CoA reductase, an enzyme in cholesterol synthesis",["Non-competitively inhibit lipase","Bind to cholesterol in the blood","Break down LDL receptors"],"Statins resemble the substrate of the enzyme and block its active site.");
M("C1.1","Isoleucine synthesis is an example of end-product inhibition. What does this mean? (HL)","The end product binds to an allosteric site on the first enzyme of the pathway, switching it off",["The end product activates the first enzyme","The substrate is destroyed","The end product is converted back to substrate"],"This is a negative feedback mechanism that prevents wasteful overproduction.");
M("C1.1","How does penicillin work as a mechanism-based inhibitor? (HL)","It irreversibly binds the active site of bacterial transpeptidase, blocking cell wall synthesis",["It reversibly binds an allosteric site on ribosomes","It binds the viral capsid","It activates lysozyme"],"Resistance can result from changes to transpeptidase so penicillin no longer binds.");
M("C1.1","Why is heat released by metabolic reactions? (HL)","Energy transfers in metabolic reactions are not 100% efficient",["Enzymes produce heat to denature substrates","Only respiration releases heat","Anabolic reactions always release heat"],"Mammals and birds use this heat to maintain body temperature.");
M("C1.1","Which of these is a cyclical metabolic pathway? (HL)","The Krebs cycle",["Glycolysis","Protein digestion","Anaerobic respiration in yeast"],"The Krebs cycle and Calvin cycle are cyclical. Glycolysis is a linear pathway.");
M("C1.1","What do enzymes do to the equilibrium of a reversible reaction?","Nothing: they speed up the approach to equilibrium in both directions",["They move equilibrium towards products","They move equilibrium towards substrates","They stop the reverse reaction"],"Catalysts do not change the energy difference between substrates and products.");

/* C1.2 Cell respiration */
F("C1.2","ATP stands for adenosine _____.",["triphosphate"],"ATP is a nucleotide that distributes energy within cells.");
M("C1.2","Energy is released when:","ATP is hydrolysed to ADP and phosphate",["ADP and phosphate are combined to make ATP","ATP is synthesised from AMP","ADP is converted to DNA"],"Energy is required to synthesise ATP, and cell respiration provides it.");
M("C1.2","Which processes use ATP?","Active transport, anabolic reactions and movement",["Osmosis, diffusion and facilitated diffusion","Passive transport only","Photolysis only"],"ATP provides energy for membrane pumps, synthesising macromolecules and moving chromosomes or the whole cell.");
M("C1.2","Compared with aerobic respiration in humans, anaerobic respiration:","Needs no oxygen, yields much less ATP and produces lactate, all in the cytoplasm",["Yields more ATP and occurs in the mitochondria","Needs oxygen and produces CO₂ and water","Produces ethanol and CO₂"],"Anaerobic respiration uses only glycolysis, plus lactate formation to regenerate NAD.");
F("C1.2","In humans, anaerobic respiration of glucose produces _____ (lactic acid).",["lactate","lactic acid","lactic"],"Pyruvate is converted to lactate, regenerating NAD so glycolysis can continue.");
M("C1.2","What are the products of anaerobic respiration in yeast?","Ethanol and carbon dioxide",["Lactate only","Water and carbon dioxide","Pyruvate only"],"Used in brewing and baking. The pathway is the same as in humans apart from NAD regeneration using pyruvate.");
M("C1.2","What is the role of NAD in respiration? (HL)","It is a hydrogen (electron) carrier, reduced when it accepts hydrogen",["It is an enzyme that digests glucose","It is a final electron acceptor","It is the main energy store"],"Oxidation is loss of electrons. When a substrate loses hydrogen it is oxidised and NAD is reduced.");
M("C1.2","What are the net products of glycolysis per glucose? (HL)","2 pyruvate, a net gain of 2 ATP and 2 reduced NAD",["6 CO₂ and 36 ATP","2 lactate and 4 ATP net","2 acetyl CoA and 2 FAD"],"Glycolysis includes phosphorylation, lysis, oxidation and ATP formation.");
F("C1.2","Glycolysis occurs in the cell _____.",["cytoplasm","cytosol"],"It does not need mitochondria or oxygen.");
M("C1.2","What does the link reaction do? (HL)","Oxidises and decarboxylates pyruvate to an acetyl group, carried by coenzyme A, in the mitochondrial matrix",["Reduces pyruvate to lactate in the cytoplasm","Converts acetyl groups to glucose","Produces most of the cell’s ATP directly"],"Acetyl CoA then enters the Krebs cycle. Lipids and carbohydrates both produce acetyl groups.");
F("C1.2","In the Krebs cycle, an acetyl group joins oxaloacetate (4C) to form the six-carbon compound _____.",["citrate"],"Oxaloacetate is regenerated, with four oxidations and two decarboxylations per turn.");
M("C1.2","Where is the electron transport chain located in a mitochondrion? (HL)","In the inner mitochondrial membrane (cristae)",["In the matrix","In the outer membrane","In the cytoplasm"],"Reduced NAD delivers electrons to the chain, and energy released pumps protons into the intermembrane space.");
M("C1.2","How does chemiosmosis make ATP in the mitochondrion? (HL)","Protons flow down their gradient through ATP synthase into the matrix, driving phosphorylation of ADP",["Electrons flow through ATP synthase","Protons are pumped through ATP synthase into the intermembrane space","Phosphate is transferred directly from glucose"],"ATP synthase couples release of energy from the gradient to ATP synthesis.");
F("C1.2","In aerobic respiration, oxygen is the terminal electron _____.",["acceptor"],"Oxygen combines with electrons and protons to form water.");
M("C1.2","Compared with carbohydrates, lipids as respiratory substrates: (HL)","Yield more energy per gram, and enter via acetyl CoA, so they are not used in glycolysis or anaerobic respiration",["Yield less energy per gram","Are used in anaerobic respiration","Contain more oxygen"],"Lipids have more hydrogen and carbon to oxidise and less oxygen.");
M("C1.2","Which factor affects the rate of cell respiration?","Temperature",["Wavelength of light","Atmospheric nitrogen","Soil pH"],"Respiration rate also depends on substrate concentration and oxygen availability.");

/* C1.3 Photosynthesis */
M("C1.3","Which word equation represents photosynthesis?","Carbon dioxide + water → glucose + oxygen, using light energy",["Glucose + oxygen → carbon dioxide + water","Carbon dioxide + glucose → water + oxygen","Water + oxygen → glucose + carbon dioxide"],"Light energy is transformed into chemical energy in carbon compounds.");
F("C1.3","The oxygen released in photosynthesis comes from the splitting of _____.",["water","h2o"],"Photolysis of water also supplies protons and electrons.");
M("C1.3","Why does chromatography separate photosynthetic pigments?","Pigments differ in solubility and attraction to the paper, so they travel different distances",["They differ in mass only","They all have the same solubility","Light pushes them different distances"],"Rf values identify the pigments (carotene travels furthest).");
M("C1.3","Why do leaves appear green?","Chlorophyll absorbs mainly red and blue light and reflects green light",["Chlorophyll absorbs green light","Carotene reflects green light","Leaves emit green light"],"Absorbed light excites electrons in the pigment, transforming energy.");
M("C1.3","What is the difference between an absorption spectrum and an action spectrum?","The absorption spectrum shows the wavelengths absorbed by pigments, and the action spectrum shows the rate of photosynthesis at each wavelength",["They show exactly the same data","The absorption spectrum shows rate of photosynthesis","The action spectrum shows the pigments’ colours"],"They are similar in shape but not identical, because accessory pigments also contribute.");
M("C1.3","What do FACE experiments investigate?","The effect of elevated CO₂ on plant growth in open-air field conditions",["The separation of pigments","The effect of light on enclosed seedlings only","The absorption spectrum of chlorophyll"],"Free-air CO₂ enrichment predicts future photosynthesis and plant growth.");
M("C1.3","What happens in photosystem II? (HL)","Light excites electrons and water is split, releasing oxygen, protons and electrons",["Carbon dioxide is fixed","NADP is reduced by photosystem II","ATP is hydrolysed"],"Oxygen is a waste product of photolysis.");
M("C1.3","How is the proton gradient in thylakoids used? (HL)","ATP synthase uses it to make ATP by chemiosmosis",["It reduces carbon dioxide directly","It splits water","It produces oxygen"],"Protons are pumped into the thylakoid space by the electron carriers and flow out through ATP synthase.");
F("C1.3","Photosystem I reduces NADP to _____.",["nadph","reduced nadp"],"NADPH and ATP are used in the Calvin cycle.");
M("C1.3","What does Rubisco do in the Calvin cycle? (HL)","It fixes CO₂ by combining it with RuBP, forming two molecules of glycerate 3-phosphate",["It splits water","It makes ATP","It regenerates NADP"],"Carbon fixation: RuBP (5C) + CO₂ → 2 GP (3C).");
M("C1.3","Glycerate 3-phosphate is converted to triose phosphate using: (HL)","ATP and reduced NADP",["Light directly","Oxygen","ADP and NADP"],"Triose phosphate can form carbohydrates, amino acids and other compounds.");
M("C1.3","If glucose is the product, what fraction of the triose phosphate made must be used to regenerate RuBP? (HL)","Five-sixths",["One-sixth","One-half","None of it"],"Only one-sixth of triose phosphate can be taken out for the synthesis of glucose.");
M("C1.3","Why are the light-dependent and light-independent reactions interdependent? (HL)","The Calvin cycle needs ATP and reduced NADP from the light reactions, which in turn need ADP and NADP regenerated by the Calvin cycle",["They occur in different organisms","The Calvin cycle produces the light","Only the light reactions need ATP"],"No light stops the light reactions, and no CO₂ stops the Calvin cycle.");
M("C1.3","A rise in light intensity no longer increases the rate of photosynthesis. Which is most likely limiting?","Carbon dioxide concentration or temperature",["Light intensity","Oxygen concentration","The wavelength of light only"],"Limiting factors include light intensity, CO₂ concentration and temperature.");

/* C2.1 Chemical signalling (HL) */
M("C2.1","What is a ligand?","A signalling chemical that binds to a specific receptor",["A receptor protein","An enzyme that makes second messengers","A type of ion channel"],"Receptors are proteins with binding sites specific for particular ligands.");
M("C2.1","How does quorum sensing work in Vibrio fischeri?","Bacteria release a signalling molecule, and at high cell density it triggers expression of genes for bioluminescence",["Bacteria glow all the time regardless of density","Each bacterium glows only when alone","Light switches on genes in the host squid"],"Cell signalling by bacteria depends on population density.");
M("C2.1","How do hormones differ from neurotransmitters?","Hormones travel in the blood to distant target cells, whereas neurotransmitters act across a synaptic cleft",["Hormones act only across synapses","Hormones are always proteins","Neurotransmitters are always steroids"],"Cytokines and calcium ions are other examples of signalling chemicals, and effects can be local or distant.");
M("C2.1","Which of these is a steroid hormone?","Oestradiol",["Insulin","Adrenaline","Nitric oxide"],"Chemical classes include amines (adrenaline), proteins (insulin), steroids (oestradiol) and nitric oxide.");
M("C2.1","How do transmembrane and intracellular receptors differ?","Hydrophilic signals bind transmembrane receptors, whereas hydrophobic signals such as steroids cross the membrane and bind intracellular receptors",["Hydrophobic signals bind transmembrane receptors only","Both bind only hydrophilic ligands","Intracellular receptors are found only in the plasma membrane"],"Transmembrane receptors have hydrophobic regions in the bilayer and hydrophilic regions outside.");
M("C2.1","The acetylcholine receptor on a postsynaptic membrane is:","A ligand-gated ion channel that opens when acetylcholine binds, changing membrane potential",["A G protein-coupled receptor","An intracellular receptor","A pump powered by ATP"],"Neurotransmitter binding changes the voltage across the plasma membrane.");
M("C2.1","What happens after epinephrine (adrenaline) binds its receptor?","A G protein is activated, leading to production of cyclic AMP as a second messenger",["The receptor enters the nucleus","DNA is directly transcribed","An ion channel opens immediately"],"The second messenger relays and amplifies the signal inside the cell.");
F("C2.1","Cyclic AMP acts as a second _____ in the epinephrine pathway.",["messenger"],"Signal transduction pathways relay and amplify signals from receptors.");
M("C2.1","The insulin receptor is a:","Transmembrane receptor with tyrosine kinase activity, which phosphorylates tyrosine inside the cell",["Intracellular receptor that alters transcription","Ligand-gated ion channel","G protein-coupled receptor"],"Insulin binding triggers a phosphorylation cascade.");
M("C2.1","How do steroid hormones such as oestradiol and testosterone act?","They enter the cell and bind intracellular receptors that affect gene expression",["They bind transmembrane G proteins","They open ion channels at synapses","They inhibit ribosomes directly"],"The hormone–receptor complex acts as a transcription factor.");
M("C2.1","Which is an example of positive feedback in signalling?","Oxytocin stimulating uterine contractions, which stimulate more oxytocin release during childbirth",["Insulin lowering blood glucose, which reduces insulin secretion","Thyroxin lowering its own release","Glucagon decreasing blood glucose"],"Negative feedback reverses a change and positive feedback amplifies it.");

/* C2.2 Neural signalling */
M("C2.2","How is the resting potential of a neuron maintained?","The Na⁺/K⁺ pump moves 3 Na⁺ out and 2 K⁺ in using ATP, and K⁺ leaks out, making the inside negative",["Na⁺ and K⁺ diffuse in equal amounts","Chloride channels pump ions using ATP","No ions cross the membrane"],"Resting potential is about –70 mV.");
M("C2.2","What causes depolarization during an action potential? (HL)","Voltage-gated Na⁺ channels open and Na⁺ rushes in",["K⁺ rushes in","The Na⁺/K⁺ pump reverses","Cl⁻ rushes out"],"A threshold potential must be reached for the sodium channels to open.");
M("C2.2","What causes repolarization? (HL)","Sodium channels close and voltage-gated potassium channels open, so K⁺ flows out",["Sodium channels open wider","Potassium channels close and Na⁺ rushes in","The Na⁺/K⁺ pump stops"],"The pump then restores the original ion distributions.");
M("C2.2","What is the threshold potential? (HL)","The level of depolarization needed to open enough voltage-gated Na⁺ channels to trigger an action potential",["The resting potential","The most negative value reached after repolarization","The potential of the synaptic cleft"],"If the threshold is not reached, no action potential fires (all-or-nothing).");
M("C2.2","How does an action potential travel along an axon? (HL)","Local currents: Na⁺ diffusing inside the axon depolarises the adjacent region to threshold",["The pump carries the impulse along the axon","Electrons flow along the axon like in a wire","Sodium ions travel the full length of the axon"],"Each section triggers the next, and the refractory period gives one-way propagation.");
M("C2.2","What is saltatory conduction? (HL)","The impulse jumps between nodes of Ranvier in myelinated fibres, speeding conduction",["The impulse moves continuously along an unmyelinated axon","Myelin pumps ions faster","The impulse travels backwards"],"Ion channels and pumps are concentrated at the nodes, where depolarization occurs.");
M("C2.2","Which factors increase the speed of nerve impulses?","Larger axon diameter and myelination",["Smaller axon diameter","Lack of myelin","Lower temperature only"],"Squid giant axons are fast because of their large diameter. Speed is correlated with axon diameter.");
M("C2.2","Why does a typical synapse conduct in only one direction?","Neurotransmitter is released only from the presynaptic membrane and receptors are only on the postsynaptic membrane",["Neurotransmitter is released from both sides","Receptors are present on both sides","Ca²⁺ cannot cross the cleft"],"Chemical synapses are unidirectional.");
F("C2.2","Depolarization of the presynaptic membrane causes _____ ions to enter, triggering vesicle fusion.",["calcium","ca2","ca","calcium ions"],"Calcium entry causes vesicles of neurotransmitter to fuse with the membrane and release by exocytosis.");
M("C2.2","What is the correct order of events at a synapse?","Presynaptic depolarization → Ca²⁺ enters → vesicles release neurotransmitter → diffusion across the cleft → binding to receptors → EPSP in postsynaptic membrane",["Ca²⁺ enters → depolarization → receptors bind → vesicles fuse","Receptors bind → vesicles fuse → depolarization → Ca²⁺ enters","Vesicles fuse → Ca²⁺ enters → diffusion → depolarization"],"For acetylcholine, binding opens ligand-gated channels and generates an excitatory postsynaptic potential.");
M("C2.2","Neonicotinoid pesticides affect synaptic transmission by: (HL)","Binding to acetylcholine receptors in insects and blocking transmission",["Increasing release of dopamine","Destroying myelin","Opening potassium channels in presynaptic terminals"],"Cocaine, in contrast, blocks reuptake of neurotransmitter.");
M("C2.2","Cocaine acts by: (HL)","Blocking the reuptake of neurotransmitter, prolonging its effect on the postsynaptic membrane",["Destroying receptors","Increasing neurotransmitter breakdown","Blocking calcium channels in the postsynaptic cell"],"The neurotransmitter stays longer in the synaptic cleft.");
M("C2.2","Inhibitory neurotransmitters cause: (HL)","Hyperpolarization of the postsynaptic membrane (an IPSP), making an action potential less likely",["Depolarization to threshold","Opening of voltage-gated Na⁺ channels","An increase in Ca²⁺ entry"],"Inhibitory transmitters open channels such as Cl⁻ or K⁺, making the inside more negative.");
M("C2.2","What does summation mean in a postsynaptic neuron? (HL)","The effects of excitatory and inhibitory inputs are added, and an action potential fires only if threshold is reached",["Only excitatory signals matter","Each signal causes a separate action potential","Signals cancel out completely"],"Many presynaptic inputs converge on one postsynaptic neuron.");
M("C2.2","Why does capsaicin from chilli peppers cause a burning sensation? (HL)","It opens cation channels in free nerve endings, so positive ions enter and trigger impulses perceived as pain",["It destroys the pain receptors","It blocks sodium channels","It increases myelination"],"The same channels respond to high temperature and acid.");

/* ---- Unit C part 2 ---- */
/* C3.1 Integration of body systems */
M("C3.1","Compared with the endocrine system, messages in the nervous system are:","Fast, short-lived and targeted electrical impulses",["Slow, long-lasting and widespread","Carried in the blood plasma","Always steroid-based"],"The endocrine system uses hormones transported in blood, with slower but longer-lasting effects. The blood system also transports materials between organs.");
M("C3.1","Which role does the spinal cord play?","It is an integrating centre for unconscious processes such as reflexes",["It is the centre of conscious thought","It controls the endocrine system","It stores long-term memory"],"Conscious processing occurs in the cerebral hemispheres of the brain.");
M("C3.1","Which neurons carry impulses from receptors to the CNS, and which carry impulses from the CNS to muscles?","Sensory neurons to the CNS; motor neurons to effectors",["Motor neurons to the CNS; sensory neurons to effectors","Both carry impulses only to the CNS","Interneurons only"],"Nerves are bundles of sensory and motor neuron fibres in a protective sheath.");
M("C3.1","What is the correct sequence in a pain reflex arc?","Pain receptor → sensory neuron → interneuron in the spinal cord → motor neuron → effector muscle",["Receptor → motor neuron → interneuron → sensory neuron → muscle","Receptor → brain → motor neuron → muscle","Effector → sensory neuron → receptor"],"A reflex arc is an involuntary response that does not require conscious thought.");
M("C3.1","What is the role of the cerebellum?","Coordinating skeletal muscle contraction and balance",["Controlling heart rate and ventilation","Producing melatonin","Producing thyroxin"],"The medulla coordinates control of heart rate and ventilation.");
F("C3.1","Melatonin, which helps establish the sleep–wake cycle, is secreted by the _____ gland.",["pineal"],"Melatonin secretion follows a daily (circadian) rhythm and is higher at night.");
M("C3.1","How does epinephrine (adrenaline) prepare the body for vigorous activity?","Increases heart rate, mobilises glucose and diverts blood flow to muscles",["Decreases heart rate and ventilation","Promotes digestion","Increases blood flow to the gut"],"It is secreted by the adrenal glands.");
M("C3.1","How does the hypothalamus control the endocrine system?","It releases hormones that regulate the pituitary gland, which then releases hormones that control other glands",["It directly produces insulin","It sends impulses to the thyroid through motor neurons","It stores hormones for the adrenal glands"],"The hypothalamus links the nervous and endocrine systems.");
M("C3.1","How is heart rate controlled by feedback?","Baroreceptors and chemoreceptors send impulses to the medulla, which changes the heart’s rate and stroke volume via nerves",["The cerebellum changes heart rate directly","Muscles send hormones to the heart","The heart rate stays fixed"],"Baroreceptors detect blood pressure and chemoreceptors detect CO₂ and pH.");
M("C3.1","Why does ventilation rate increase during exercise?","Chemoreceptors detect increased CO₂ (lower blood pH) and the medulla signals muscles to increase breathing",["Oxygen concentration rises sharply in the blood","Baroreceptors detect high oxygen","The heart signals the lungs directly"],"This is negative feedback, restoring blood pH and CO₂ levels.");
M("C3.1","Peristalsis in the gut is controlled mainly by:","The enteric nervous system, involuntarily (swallowing and egestion are voluntary, CNS controlled)",["The cerebellum","Insulin","The spinal cord only"],"The ENS works largely independently of the CNS.");
M("C3.1","Shoots bend toward light (positive phototropism) because: (HL)","Auxin accumulates on the shaded side, promoting cell elongation there",["Auxin accumulates on the lit side","Cytokinin accumulates on the shaded side","Ethylene is produced only in the roots"],"Positive phototropism is a directional growth response to lateral light.");
M("C3.1","How does auxin promote cell elongation? (HL)","It promotes H⁺ secretion into the cell wall, acidifying it and loosening cellulose cross-links",["It makes cell walls thicker","It stops water uptake","It increases cell division only"],"Turgor pressure then stretches the loosened wall.");
M("C3.1","What is the interaction between auxin and cytokinin? (HL)","Shoot tips make auxin, which is transported to the roots, and root tips make cytokinin, which is transported to the shoots, balancing growth",["Both are made only in leaves","Auxin and cytokinin always have the same effect","Cytokinin is made in shoot tips only"],"The interaction regulates root and shoot growth.");
M("C3.1","Ethylene in fruit ripening is an example of: (HL)","Positive feedback: ethylene stimulates more ethylene production",["Negative feedback","A reflex arc","Competitive inhibition"],"One ripening fruit can speed up ripening in others nearby.");

/* C3.2 Defence against disease */
M("C3.2","What forms the primary defence against pathogens?","Skin and mucous membranes",["Antibodies","Memory cells","Platelets"],"Mucus traps microbes and secretions can kill them.");
M("C3.2","How do cuts in the skin seal by clotting?","Platelets release clotting factors, starting a cascade in which thrombin converts fibrinogen to fibrin, trapping red blood cells",["Fibrin is converted to fibrinogen","Platelets produce antibodies","White blood cells make the clot"],"The clot seals the wound and prevents entry of pathogens.");
M("C3.2","How do innate and adaptive immunity differ?","Innate immunity responds to broad categories of pathogen and does not change; adaptive immunity is specific and builds memory",["Innate immunity is specific; adaptive is not","Adaptive immunity does not need lymphocytes","Both build memory"],"The adaptive response becomes more effective after repeated exposure.");
M("C3.2","What do phagocytes do?","Move to infection sites, engulf pathogens by endocytosis and digest them with lysosomal enzymes",["Produce antibodies","Make fibrin","Secrete antibiotics"],"Phagocytes recognise pathogens and move by amoeboid movement from blood.");
F("C3.2","Molecules that trigger antibody production are called _____.",["antigens","antigen"],"Antigens are recognition molecules on pathogens.");
M("C3.2","Which cells activate B-lymphocytes?","Helper T-lymphocytes",["Platelets","Red blood cells","Phagocytes only"],"Antigen-specific B cells and helper T cells cooperate.");
M("C3.2","What happens to an activated B-lymphocyte?","It multiplies to form a clone of antibody-secreting plasma cells (and memory cells)",["It produces fibrin","It engulfs pathogens","It becomes a red blood cell"],"Clonal selection gives a large number of cells specific to one antigen.");
M("C3.2","Why is a person immune after recovering from an infection?","Memory cells remain and respond rapidly if the pathogen returns",["Plasma cells live forever","Antibiotics remain in the blood","Phagocytes become specific"],"Immunity is the ability to eliminate an infectious disease from the body.");
M("C3.2","How is HIV transmitted?","By exchange of body fluids such as blood, semen, vaginal fluids and breast milk",["By coughing and sneezing","By sharing food","By mosquito bites"],"Examples include unprotected sex, shared needles and mother-to-child transmission.");
M("C3.2","Why does HIV infection lead to AIDS?","HIV infects and destroys helper T-lymphocytes, limiting antibody production and allowing opportunistic infections",["HIV destroys red blood cells","HIV blocks phagocytes only","HIV makes the body produce too many antibodies"],"AIDS is the consequence of the loss of a certain type of lymphocyte.");
M("C3.2","Antibiotics are chemicals that:","Block processes occurring in bacteria but not in eukaryotic cells",["Kill viruses","Block all cell processes","Block processes in human cells only"],"Antibiotics therefore do not control viral infections.");
M("C3.2","How does antibiotic resistance evolve?","Random mutations give some bacteria resistance; antibiotics select for them, so they survive and reproduce",["Bacteria deliberately adapt to the drug","Antibiotics cause the specific resistance mutations","Patients’ immune cells make bacteria resistant"],"Careful use of antibiotics slows the emergence of multiresistant bacteria.");
M("C3.2","What are zoonoses?","Infectious diseases that transfer from other species to humans, such as rabies and COVID-19",["Diseases caused only by fungi","Diseases passed only between humans","Genetic disorders"],"Other examples: tuberculosis and Japanese encephalitis.");
M("C3.2","How do vaccines work?","They contain antigens (or nucleic acids coding for them) that stimulate immunity without causing the disease",["They contain antibodies that destroy pathogens at once","They kill bacteria directly","They contain live, fully virulent pathogens"],"Vaccination produces memory cells for a specific pathogen.");
M("C3.2","What is herd immunity?","When a sufficient proportion of a population is immune, transmission is impeded and non-immune individuals are protected",["Immunity of animals in a herd only","When everyone has had the disease","When antibiotics are given to a whole population"],"Members of a population are interdependent in building herd immunity.");

/* C4.1 Populations and communities */
M("C4.1","What is a population?","An interacting group of organisms of the same species living in an area",["All the organisms in an ecosystem","A group of different species in an area","A group of ecosystems"],"A community is all the interacting organisms of different species in an ecosystem.");
M("C4.1","Why are random sampling and quadrats used?","To estimate population size of sessile organisms without counting every individual",["To estimate the size of mobile populations only by marking","To measure respiration rates","To produce karyotypes"],"Random placement avoids bias.");
M("C4.1","In a mark–recapture study, 40 animals were marked and released. In a second sample of 50, 10 were marked. What is the Lincoln index estimate of population size?","200",["80","20","500"],"Estimate = (M × N) ÷ R = (40 × 50) ÷ 10 = 200.");
M("C4.1","Which is an assumption of the capture–mark–release–recapture method?","Marking does not affect survival, marked animals mix randomly, and there is no significant immigration, emigration, birth or death",["All individuals are recaptured","The organisms are sessile","Marks make animals more visible to predators"],"Breaking these assumptions biases the estimate.");
F("C4.1","The maximum population size that an environment can sustain indefinitely is its carrying _____.",["capacity"],"It is set by limiting resources such as food, space or water.");
M("C4.1","Density-dependent factors:","Have greater effects as population density rises (such as competition, predation and disease), giving negative feedback",["Are unaffected by density, such as storms and wildfires","Always increase population growth","Affect only plants"],"They help regulate populations around the carrying capacity.");
M("C4.1","Why does a population show exponential growth at first?","Resources are abundant and mortality is low, so birth rate far exceeds death rate",["Resources are scarce","Predators are numerous","Death rate is high"],"Growth then slows as limiting factors act, giving an S-shaped curve.");
M("C4.1","Why does a sigmoid population growth curve level off?","Birth and death rates become equal at the carrying capacity",["Birth rate rises","The population has no more genetic variation","Death rate falls to zero"],"Limiting factors increase with density.");
M("C4.1","Which is an example of mutualism?","Nitrogen-fixing bacteria in the root nodules of legumes",["A tapeworm in the intestine","A lion eating a zebra","Two plants competing for light"],"Other examples: zooxanthellae in corals and mycorrhizae in orchids.");
M("C4.1","A tick feeding on a dog is an example of:","Parasitism",["Mutualism","Herbivory","Predation"],"Parasites benefit while harming the host but usually do not kill it quickly.");
M("C4.1","What is the difference between top-down and bottom-up control of populations?","Top-down: predators limit prey. Bottom-up: availability of resources or producers limits consumers",["Top-down: producers limit predators. Bottom-up: predators limit producers","They are the same thing","Top-down: abiotic factors only"],"One type of control is usually dominant in a given community.");
M("C4.1","What is allelopathy?","One organism releasing chemicals that inhibit the growth of other organisms",["Two species benefiting each other","A predator hunting in groups","Competition for light"],"An example: black walnut trees releasing juglone.");
M("C4.1","A chi-squared test for association between two species is used to test whether:","They occur together in sampling sites more or less often than expected by chance",["Their populations are the same size","One feeds on the other","They have the same genome size"],"It compares observed and expected frequencies of presence or absence in samples.");

/* C4.2 Transfers of energy and matter */
M("C4.2","Why are ecosystems described as open systems?","Both energy and matter can enter and leave them",["Only energy can enter","Neither matter nor energy can leave","Matter cannot enter"],"Ecosystems exchange energy and matter with their surroundings.");
M("C4.2","What is the principal energy source for most ecosystems?","Sunlight",["Geothermal energy","Heat from decomposition","Chemical energy from fossil fuels"],"Exceptions include cave and deep ocean ecosystems.");
F("C4.2","Organisms that make their own carbon compounds from simple inorganic substances are called _____.",["autotrophs","autotroph","producers"],"Photoautotrophs use light, chemoautotrophs use oxidation reactions.");
M("C4.2","Chemoautotrophs obtain energy from:","Oxidation of inorganic chemicals, for example iron-oxidising bacteria",["Sunlight","Eating other organisms","Dead organic matter"],"Oxidation reactions release energy.");
M("C4.2","Why does energy availability fall at each successive trophic level?","Energy is lost as heat from respiration and as uneaten or undigested material (egested)",["Energy is destroyed","Photosynthesis increases at higher levels","Predators do not need energy"],"Energy transfers are not 100% efficient. Only a small proportion of the energy passes on.");
M("C4.2","Roughly what proportion of energy is transferred between trophic levels?","About 10%",["About 50%","About 90%","100%"],"Values vary, but the transfer is typically 5–20%.");
M("C4.2","Why is the number of trophic levels in a food chain restricted?","Too little energy remains at higher levels to support more consumers",["Predators eat each other","Producers are too large","There are not enough decomposers"],"Energy losses at each level limit chains to a few levels.");
M("C4.2","Producers in an ecosystem contain 10 000 kJ of energy and primary consumers 1 200 kJ. What is the percentage energy transfer?","12%",["8.3%","1.2%","120%"],"(1 200 ÷ 10 000) × 100 = 12%.");
F("C4.2","The accumulation of carbon compounds in biomass by autotrophs is called _____ production.",["primary"],"Secondary production is accumulation of biomass by heterotrophs.");
M("C4.2","Why is secondary production lower than primary production?","Much carbon is lost as CO₂ in respiration and not all biomass is eaten or digested",["Consumers do not respire","Producers lose more energy as heat","Decomposers produce biomass faster"],"Biomass is lost at each stage.");
M("C4.2","When is a forest a carbon sink?","When photosynthesis exceeds respiration and carbon accumulates in biomass",["When respiration exceeds photosynthesis","When it is burned","When there are no trees"],"Burning or decay can make a forest a carbon source.");
M("C4.2","How are the Keeling Curve’s features explained?","Annual fluctuations reflect seasonal photosynthesis and respiration, and the rising trend reflects fossil fuel combustion",["Annual fluctuations are caused by volcanoes","CO₂ has been falling since 1958","The trend reflects increased photosynthesis only"],"CO₂ rises in the northern winter and falls in the summer.");
M("C4.2","Which statement correctly compares energy flow and nutrient cycling?","Energy flows in one direction and is lost as heat, whereas matter is recycled",["Both are recycled","Both flow in one direction","Matter is lost as heat"],"Decomposers play a key role in recycling elements such as carbon and nitrogen.");

/* ---- Unit D part 1 ---- */
/* D1.1 DNA replication */
M("D1.1","What does ‘semi-conservative’ replication mean?","Each new DNA molecule has one original strand and one newly made strand",["Both new molecules are entirely new","One molecule is all original and one all new","Only half of the genome is copied"],"Complementary base pairing gives a high degree of accuracy in copying base sequences.");
M("D1.1","What does helicase do in DNA replication?","Unwinds the double helix by breaking hydrogen bonds between bases",["Joins nucleotides together","Seals Okazaki fragments","Makes RNA primers"],"The separated strands act as templates.");
M("D1.1","What is the general role of DNA polymerase?","It adds nucleotides to build a new strand complementary to the template",["It unwinds the DNA","It cuts DNA at specific sequences","It joins RNA nucleotides only"],"Polymerase forms covalent bonds between nucleotides in the sugar–phosphate backbone.");
M("D1.1","Why is Taq polymerase used in PCR?","It is heat-stable and survives the denaturation step at about 95 °C",["It works only at 0 °C","It does not need primers","It cuts DNA at 95 °C"],"Taq comes from a thermophilic bacterium.");
M("D1.1","What is the sequence of steps in one PCR cycle?","Denaturation (~95 °C), annealing of primers (~55 °C), extension (~72 °C)",["Extension, denaturation, annealing","Annealing, extension, denaturation at 4 °C","Denaturation at 72 °C, annealing at 95 °C"],"The number of copies roughly doubles every cycle.");
M("D1.1","In gel electrophoresis, DNA fragments are separated by:","Size: smaller fragments travel further through the gel",["Colour","Sequence only","Size: larger fragments travel further"],"DNA is negatively charged, so it moves toward the positive electrode.");
F("D1.1","In gel electrophoresis, negatively charged DNA moves toward the _____ electrode.",["positive","anode"],"Smaller fragments move through the gel pores faster.");
M("D1.1","DNA profiling using PCR and gel electrophoresis is used for:","Paternity testing and forensic investigations",["Measuring blood glucose","Producing proteins","Counting chromosomes"],"Variable regions (short tandem repeats) differ between individuals.");
M("D1.1","DNA polymerases add new nucleotides to which end of the growing strand? (HL)","The 3′ end",["The 5′ end","Either end","The middle of the strand"],"Synthesis proceeds in the 5′→3′ direction.");
M("D1.1","How does the lagging strand differ from the leading strand? (HL)","It is made discontinuously as Okazaki fragments, which are later joined by DNA ligase",["It is made continuously toward the fork","It is made by RNA polymerase","It needs no primers"],"The leading strand is made continuously, in the same direction as the fork moves.");
M("D1.1","What does DNA primase do? (HL)","Synthesises a short RNA primer to which DNA polymerase III can add nucleotides",["Unwinds DNA","Joins Okazaki fragments","Proofreads new DNA"],"DNA polymerase I later replaces the RNA primers with DNA, and ligase seals the gaps.");
M("D1.1","What does DNA polymerase III do during proofreading? (HL)","Removes a mismatched nucleotide from the 3′ end and replaces it with the correct one",["Cuts out introns","Removes primers only","Adds methyl groups"],"Proofreading greatly reduces the error rate.");

/* D1.2 Protein synthesis */
F("D1.2","Transcription is the synthesis of _____ using a DNA template.",["rna","mrna"],"RNA polymerase carries out transcription.");
M("D1.2","A DNA template strand reads 3′-TACGGT-5′. What is the mRNA sequence?","5′-AUGCCA-3′",["5′-ATGCCA-3′","5′-UACGGU-3′","5′-TACGGT-3′"],"A pairs with U in RNA, and T pairs with A, G with C.");
M("D1.2","Where does translation occur?","On ribosomes in the cytoplasm",["In the nucleolus","On the DNA template","In lysosomes"],"Ribosomes read mRNA codons and tRNA delivers amino acids.");
F("D1.2","A group of three bases on mRNA that specifies an amino acid is called a _____.",["codon"],"The triplet code has 64 codons for 20 amino acids and stop signals.");
F("D1.2","The three-base sequence on tRNA that pairs with an mRNA codon is the _____.",["anticodon"],"Pairing is by complementary bases and hydrogen bonding.");
M("D1.2","What does it mean that the genetic code is degenerate?","Most amino acids are coded for by more than one codon",["One codon codes for several amino acids","The code differs in each species","The code has no stop codons"],"Universality means almost all organisms use the same code.");
M("D1.2","Why must the genetic code be a triplet code?","Two bases give only 16 combinations, too few for 20 amino acids, while three give 64",["Four bases give 16 combinations","One base gives 20 combinations","Triplets are easier for ribosomes"],"4² = 16 and 4³ = 64.");
M("D1.2","On a ribosome, which tRNA binding site holds the tRNA attached to the growing polypeptide?","The P site",["The A site","The E site","The small subunit’s surface"],"A site: incoming tRNA, P site: tRNA with the polypeptide, E site: exit.");
M("D1.2","How does initiation of translation occur? (HL)","The small subunit binds the 5′ end of mRNA, moves to the start codon, the initiator tRNA binds, and then the large subunit attaches",["The large subunit binds first and unwinds the mRNA","The mRNA binds the E site only","The anticodon binds DNA"],"The first amino acid is methionine, with start codon AUG.");
M("D1.2","Which is a post-transcriptional modification in eukaryotes? (HL)","Removal of introns, splicing of exons, and addition of a 5′ cap and poly-A tail",["Addition of introns","Removal of the 5′ cap","Unwinding of DNA"],"The cap and tail help stabilise mRNA.");
M("D1.2","What is alternative splicing? (HL)","Different combinations of exons are joined, producing variant proteins from a single gene",["Cutting introns out of DNA","Making the same protein every time","Joining mRNA from different genes"],"It increases protein diversity without increasing gene number.");
M("D1.2","Which are examples of non-coding DNA sequences? (HL)","Introns, telomeres and regulators of gene expression",["Exons","Codons for amino acids","Anticodons on tRNA"],"Genes for rRNA and tRNA are also not translated into polypeptides.");
M("D1.2","What is the role of proteasomes? (HL)","They break down proteins into amino acids for recycling",["They synthesise proteins","They make mRNA","They remove introns"],"Sustaining a functional proteome needs continuous breakdown and synthesis.");
M("D1.2","What are the directions of transcription and translation? (HL)","mRNA is made 5′→3′ and read 5′→3′ by the ribosome",["mRNA is made 3′→5′ and read 5′→3′","Both proceed 3′→5′","mRNA is made 5′→3′ and read 3′→5′"],"Transcription begins at a promoter.");

/* D1.3 Mutations and gene editing */
M("D1.3","What is a gene mutation?","A structural change to a gene at the molecular level, such as a substitution, insertion or deletion",["A change in chromosome number","A change in the environment","A change in cell size"],"Mutations alter the base sequence of DNA.");
M("D1.3","Why can a base substitution be silent?","Because the genetic code is degenerate, the new codon may code for the same amino acid",["Because substitutions are always repaired","Because DNA is not translated","Because mRNA is never changed"],"SNPs may or may not change an amino acid.");
M("D1.3","Which type of mutation most often causes a frameshift?","Insertion or deletion of a number of bases that is not a multiple of three",["Substitution of one base","Substitution of three bases","Duplication of a whole chromosome"],"All codons downstream are changed, usually giving a non-functional protein.");
M("D1.3","Sickle-cell anaemia is caused by:","A single base substitution that changes one amino acid in the β-globin chain",["Deletion of a chromosome","Loss of the gene for haemoglobin","An extra copy of chromosome 21"],"Glutamic acid is replaced by valine, altering haemoglobin structure.");
M("D1.3","Which is a mutagen?","UV radiation, X-rays or certain chemicals",["Vitamin C","Water","Glucose"],"Mutations can also be caused by errors in DNA replication or repair.");
M("D1.3","In what sense are mutations random?","They can occur anywhere in the genome, and they are not directed by an organism’s needs",["They occur only in non-coding DNA","They always occur at the same base","They are caused by need"],"Some bases are more likely to mutate than others.");
M("D1.3","What is the difference between germline and somatic mutations?","Germline mutations can be inherited, whereas somatic mutations may cause cancer but are not passed to offspring",["Somatic mutations are inherited","Germline mutations cause only cancer","They are identical in effect"],"Germ cells give rise to gametes.");
M("D1.3","Why is mutation essential for evolution?","It is the original source of new alleles and genetic variation on which selection acts",["It always improves fitness","It removes variation","It stops natural selection"],"Most mutations are harmful or neutral, but over time some are beneficial.");
F("D1.3","A technique that inactivates a gene to investigate its function is called gene _____.",["knockout","knock out","knock-out"],"Observing the effect of an inoperative gene shows its role.");
M("D1.3","How does CRISPR–Cas9 edit genes? (HL)","A guide RNA leads the Cas9 enzyme to a specific DNA sequence, where it cuts the DNA",["Cas9 synthesises new DNA","Guide RNA cuts the DNA","Cas9 translates mRNA"],"Cells repair the cut, allowing genes to be disabled or modified.");
M("D1.3","Why are some gene sequences highly conserved across species? (HL)","Mutations in them are likely to be harmful, so natural selection removes changed versions",["They mutate more rapidly","They are not needed","They are not transcribed"],"Conserved sequences usually code for functions important to survival.");

/* D2.1 Cell and nuclear division */
M("D2.1","How does cytokinesis differ between animal and plant cells?","Animal: a ring of actin and myosin pinches the membrane. Plant: vesicles build a cell plate and new wall",["Plant: contractile ring. Animal: cell plate","Both use a contractile ring","Neither involves membranes"],"Cytokinesis divides the cytoplasm after nuclear division.");
M("D2.1","Which is an example of unequal cytokinesis?","Oogenesis in humans (and budding in yeast)",["Mitosis in skin cells","Binary fission","Spermatogenesis"],"Each daughter cell must receive at least one mitochondrion.");
M("D2.1","How do the products of mitosis and meiosis differ?","Mitosis gives two genetically identical diploid cells; meiosis gives four genetically different haploid cells",["Mitosis gives four haploid cells","Meiosis gives two identical cells","Both produce identical cells"],"Mitosis maintains chromosome number; meiosis halves it.");
M("D2.1","What is the correct order of mitosis?","Prophase, metaphase, anaphase, telophase",["Metaphase, prophase, telophase, anaphase","Anaphase, prophase, metaphase, telophase","Prophase, anaphase, metaphase, telophase"],"Cytokinesis follows telophase.");
M("D2.1","What happens in metaphase of mitosis?","Chromosomes line up at the equator, attached to spindle microtubules",["Sister chromatids separate","Nuclear envelope reforms","DNA is replicated"],"Microtubules and motor proteins move the chromosomes.");
M("D2.1","What happens in anaphase of mitosis?","Sister chromatids separate and move to opposite poles",["Chromosomes condense","Homologous chromosomes pair","The cell plate forms"],"Spindle fibres shorten.");
M("D2.1","In which division does the chromosome number halve?","Meiosis I, when homologous chromosomes separate",["Meiosis II","Mitosis","Interphase"],"Meiosis is a reduction division, from diploid to haploid.");
M("D2.1","When does crossing over occur?","In prophase I, between non-sister chromatids of homologous chromosomes",["In anaphase II","In metaphase I between sister chromatids","In interphase"],"It creates new combinations of alleles.");
M("D2.1","What is the effect of random orientation of bivalents at metaphase I?","Different combinations of maternal and paternal chromosomes in gametes",["Chromosomes fail to separate","Sister chromatids stay together","Crossing over is prevented"],"With n pairs, there are 2ⁿ possible combinations.");
M("D2.1","Down syndrome usually results from:","Non-disjunction in meiosis, giving a gamete with an extra chromosome 21 (trisomy 21)",["Deletion of chromosome 21","A mutation in a single gene","Crossing over in mitosis"],"Chromosomes or chromatids fail to separate.");
M("D2.1","What is the order of the cell cycle? (HL)","G1, S, G2 (interphase), then mitosis and cytokinesis",["S, G1, G2, mitosis","Mitosis, G1, S, G2","G2, S, G1, mitosis"],"DNA replication occurs in S phase, and cell growth continues during interphase.");
M("D2.1","How do cyclins control the cell cycle? (HL)","Their concentrations rise and fall, and a threshold level of a specific cyclin is needed to pass each checkpoint",["Their concentration stays constant","They cut the DNA","They carry oxygen"],"Different cyclins control different checkpoints.");
M("D2.1","How do oncogenes arise? (HL)","Mutations convert proto-oncogenes into genes that stimulate uncontrolled cell division",["Mutations in tumour suppressor genes make them proto-oncogenes","Oncogenes are inherited only","Cyclins mutate into DNA"],"Proto-oncogenes normally stimulate division in a controlled way.");
M("D2.1","What do tumour suppressor genes do? (HL)","Normally restrain cell division, so mutations that inactivate them allow uncontrolled division",["Stimulate division","Cut DNA","Repair proteins only"],"Cancer often requires several mutations.");
M("D2.1","How do malignant tumours differ from benign tumours? (HL)","Malignant tumours invade neighbouring tissue and spread (metastasis) to form secondary tumours; benign tumours do not",["Benign tumours metastasise","Malignant tumours grow slowly","They are identical"],"The original is the primary tumour.");

/* D2.2 Gene expression (HL) */
M("D2.2","What is gene expression?","The process by which information in genes affects the phenotype, for example through transcription and translation",["The copying of DNA","The inheritance of alleles only","The movement of genes between cells"],"The function of a protein product, such as an enzyme, produces the phenotype.");
M("D2.2","What are transcription factors?","Proteins that bind to specific DNA sequences to regulate transcription",["Enzymes that replicate DNA","RNA molecules that carry amino acids","Ribosomal proteins"],"They act at promoters and enhancers.");
F("D2.2","The DNA sequence where RNA polymerase binds to begin transcription is the _____.",["promoter"],"Transcription factors help RNA polymerase bind at the promoter.");
M("D2.2","What do enhancers do?","Bind transcription factors to increase transcription of a gene, sometimes far from the promoter",["Code for amino acids","Cut DNA","Stop translation"],"They are regulatory sequences in DNA.");
M("D2.2","What does epigenetics refer to?","Heritable changes in gene expression and patterns of differentiation without changes to the DNA base sequence",["Changes in the DNA sequence","Mutations in coding regions","Changes in chromosome number"],"Phenotype but not genotype is altered.");
M("D2.2","What is the usual effect of methylation of a gene’s promoter?","Reduced or silenced transcription",["Increased transcription","A change in the base sequence","Prevention of DNA replication"],"Methylation of DNA and histones are examples of epigenetic tags.");
M("D2.2","When can epigenetic changes be inherited by daughter cells or offspring?","When the epigenetic tags remain in place during mitosis or meiosis",["Only when the DNA sequence changes","Never","Only through RNA"],"Most, but not all, tags are removed from sperm and egg.");
M("D2.2","How do the genome, transcriptome and proteome compare?","The genome is the same in all cells of an organism, but the transcriptome (RNAs) and proteome (proteins) differ between cell types",["All three are identical in all cells","The proteome is the same in all cells","The genome differs in each cell"],"Differences arise from differential gene expression.");
M("D2.2","What do monozygotic twin studies show about gene expression?","Identical genomes can produce different phenotypes because of environmental influences on gene expression",["Twins always have identical phenotypes","Environment has no effect","Twins have different genomes"],"Epigenetic differences accumulate with age.");
M("D2.2","The difference between tigons and ligers is explained by:","Incomplete removal of epigenetic tags from sperm and eggs, so parent-of-origin effects differ",["Different chromosome number","Different species of mitochondria","Mutations in the lac operon"],"It shows that imprinted epigenetic tags affect gene expression.");
M("D2.2","How does lactose in the environment affect gene expression in E. coli?","It binds the repressor so the genes for lactose metabolism are transcribed",["It destroys the promoter","It stops transcription","It mutates the genes"],"This is an example of a biochemical external factor, alongside hormones such as oestradiol in animals.");

/* D2.3 Water potential */
M("D2.3","In osmosis, in which direction does water move?","From lower solute concentration to higher solute concentration across a partially permeable membrane",["From higher to lower solute concentration","Only from inside to outside the cell","Against a gradient using ATP"],"Equivalent to moving from hypotonic to hypertonic solution.");
F("D2.3","A solution with a lower solute concentration than a cell’s cytoplasm is described as _____.",["hypotonic"],"Hypertonic means higher solute concentration, and isotonic means equal.");
M("D2.3","What happens to an animal cell in a hypotonic solution?","It swells and may burst (lysis)",["It shrinks","It stays the same","It becomes turgid and firm"],"Animal cells have no cell wall to resist the pressure.");
M("D2.3","What happens to an animal cell in a hypertonic solution?","It shrinks and becomes crenated",["It bursts","It becomes turgid","Nothing"],"Water leaves the cell by osmosis.");
